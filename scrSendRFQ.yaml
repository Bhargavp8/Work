Screens:
  scrSendRFQ:
    Properties:
      Fill: =RGBA(238, 242, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
        Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
        // One vendor row can carry several addresses in Emailcontact, written as
        // "john@x.com; pete@y.com". They stay one string all the way to the flow,
        // which puts the whole lot on BCC.
        ClearCollect(
            colVendorList,
            ForAll(
                'SG Vendor Master List',
                { VendorName: field_2, VendorEmail: Coalesce(Emailcontact, "") }
            )
        );
        Set(varSvV1Name, Coalesce(varChecklist.Vendor1Name, ""));
        Set(varSvV2Name, Coalesce(varChecklist.Vendor2Name, ""));
        Set(varSvV3Name, Coalesce(varChecklist.Vendor3Name, ""));
        Set(varSvV4Name, Coalesce(varChecklist.Vendor4Name, ""));
        Set(varSvV1Email, Coalesce(varChecklist.Vendor1Email, ""));
        Set(varSvV2Email, Coalesce(varChecklist.Vendor2Email, ""));
        Set(varSvV3Email, Coalesce(varChecklist.Vendor3Email, ""));
        Set(varSvV4Email, Coalesce(varChecklist.Vendor4Email, ""));
        Set(varSvV1Manual, !IsBlank(varSvV1Name) && CountRows(Filter(colVendorList, VendorName = varSvV1Name)) = 0);
        Set(varSvV2Manual, !IsBlank(varSvV2Name) && CountRows(Filter(colVendorList, VendorName = varSvV2Name)) = 0);
        Set(varSvV3Manual, !IsBlank(varSvV3Name) && CountRows(Filter(colVendorList, VendorName = varSvV3Name)) = 0);
        Set(varSvV4Manual, !IsBlank(varSvV4Name) && CountRows(Filter(colVendorList, VendorName = varSvV4Name)) = 0);
        Set(varSaving, false);
        Set(varShowPreview, false);
        Set(varSvConfirmLeave, false);
        // Requestor files stay as attachments on the RFQ list item. Sensitivity is
        // carried by the real Purview label the requestor applied before uploading,
        // not by a column in this app.
        ClearCollect(
            colSvDocs,
            ForAll(varSelectedRFQ.Attachments As Att, { FileName: Att.DisplayName, FileLink: Att.Value })
        );
        Reset(tglSvV1Manual); Reset(cboSvV1); Reset(txtSvV1Name); Reset(txtSvV1Email);
        Reset(tglSvV2Manual); Reset(cboSvV2); Reset(txtSvV2Name); Reset(txtSvV2Email);
        Reset(tglSvV3Manual); Reset(cboSvV3); Reset(txtSvV3Name); Reset(txtSvV3Email);
        Reset(tglSvV4Manual); Reset(cboSvV4); Reset(txtSvV4Name); Reset(txtSvV4Email);
        Reset(dteSvSentDate)
    Children:
      - recSvTopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(31, 42, 68, 1)
            Height: =64
            Width: =1366
      - btnSvBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  Trim(If(tglSvV1Manual.Value, txtSvV1Name.Text, Coalesce(cboSvV1.Selected.VendorName, ""))) <> Coalesce(varChecklist.Vendor1Name, "")
                      || Trim(txtSvV1Email.Text) <> Coalesce(varChecklist.Vendor1Email, "")
                      || Trim(If(tglSvV2Manual.Value, txtSvV2Name.Text, Coalesce(cboSvV2.Selected.VendorName, ""))) <> Coalesce(varChecklist.Vendor2Name, "")
                      || Trim(txtSvV2Email.Text) <> Coalesce(varChecklist.Vendor2Email, "")
                      || Trim(If(tglSvV3Manual.Value, txtSvV3Name.Text, Coalesce(cboSvV3.Selected.VendorName, ""))) <> Coalesce(varChecklist.Vendor3Name, "")
                      || Trim(txtSvV3Email.Text) <> Coalesce(varChecklist.Vendor3Email, "")
                      || Trim(If(tglSvV4Manual.Value, txtSvV4Name.Text, Coalesce(cboSvV4.Selected.VendorName, ""))) <> Coalesce(varChecklist.Vendor4Name, "")
                      || Trim(txtSvV4Email.Text) <> Coalesce(varChecklist.Vendor4Email, ""),
                  Set(varSvConfirmLeave, true),

                  Navigate(scrBuyerQueue, ScreenTransition.Fade)
              )
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =12
            Text: ="Back"
            Width: =100
            X: =24
            Y: =14
      - lblSvTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =18
            Text: =varSelectedRFQ.Title & "   ·   Vendor list"
            Width: =560
            X: =242
      - lblSvSentBadge:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(206, 216, 236, 1)
            Font: =Font.'Open Sans'
            Height: =64
            Size: =11
            Text: |-
              =If(
                  varSelectedRFQ.'RFQ status'.Value = "RFQ sent out",
                  "Already sent to vendors, edits here update the list in place",
                  "Not yet sent to vendors"
              )
            Width: =600
            X: =742
      - recSvSummary:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =274
            Width: =324
            X: =24
            Y: =88
      - recSvSummaryHead:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =38
            Width: =324
            X: =24
            Y: =88
      - lblSvSummaryHead:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =38
            PaddingLeft: =14
            Text: ="The request"
            Width: =324
            X: =24
            Y: =88
      - lblSvSummaryBody:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(43, 54, 78, 1)
            Font: =Font.'Open Sans'
            Height: =230
            PaddingLeft: =14
            PaddingRight: =14
            Size: =11
            Text: |-
              =PlainText(Coalesce(varSelectedRFQ.Description, "")) & Char(10) & Char(10) &
              "Quantity: " & varSelectedRFQ.Quantity & " " & Coalesce(varSelectedRFQ.UOM, "") & Char(10) &
              "Urgency: " & With(
                  { d: DateDiff(Today(), varSelectedRFQ.RFQduedate, TimeUnit.Days) },
                  If(
                      varSelectedRFQ.'RFQ status'.Value in ["RFQ closed/completed", "RFQ cancelled"], "Closed",
                      IsBlank(varSelectedRFQ.RFQduedate), "No due date set",
                      d < 0, "OVERDUE by " & Abs(d) & If(Abs(d) = 1, " day", " days"),
                      d = 0, "DUE TODAY",
                      d <= 3, "URGENT, due in " & d & If(d = 1, " day", " days"),
                      "Due in " & d & " days"
                  )
              ) & Char(10) &
              "Due: " & Text(varSelectedRFQ.RFQduedate, "dd mmm yyyy") & Char(10) &
              "Raised by: " & Coalesce(varSelectedRFQ.RequestorName, varSelectedRFQ.'Created By'.DisplayName, "Unknown") & Char(10) &
              "Contact: " & Coalesce(varSelectedRFQ.'Requestor Email', varSelectedRFQ.'Created By'.Email, "no email on record") & Char(10) & Char(10) &
              If(varSelectedRFQ.'Sole Source', "SOLE SOURCE" & Char(10) & PlainText(Coalesce(varSelectedRFQ.'Business Justification', "")) & Char(10) & Char(10), "") &
              If(!IsBlank(varSelectedRFQ.'Recommend Vendor') || !IsBlank(varSelectedRFQ.RecVendor2Name) || !IsBlank(varSelectedRFQ.RecVendor3Name), "Requestor suggested " & CountRows(Filter(Table({ N: Coalesce(varSelectedRFQ.'Recommend Vendor', "") }, { N: Coalesce(varSelectedRFQ.RecVendor2Name, "") }, { N: Coalesce(varSelectedRFQ.RecVendor3Name, "") }), !IsBlank(N))) & " vendor(s), see the panel below" & Char(10), "") &
              If(!IsBlank(varChecklist.PreferredVendorName), "Requestor asked for: " & varChecklist.PreferredVendorName & Char(10) & PlainText(Coalesce(varChecklist.RequestorJustification, "")), "")
            Width: =324
            X: =24
            Y: =132
      - lblSvSentDate:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =22
            Size: =11
            Text: ="Date RFQ sent to vendors"
            Width: =324
            X: =24
            Y: =374
      - dteSvSentDate:
          Control: Classic/DatePicker@2.6.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            DefaultDate: =Coalesce(varChecklist.RFQSentDate, Today())
            Font: =Font.'Open Sans'
            Height: =36
            IconBackground: =RGBA(56, 96, 178, 1)
            IconFill: =RGBA(255, 255, 255, 1)
            Size: =12
            Width: =324
            X: =24
            Y: =398
      - btnSvSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            Color: =RGBA(56, 96, 178, 1)
            DisabledBorderColor: =RGBA(214, 221, 233, 1)
            DisabledColor: =RGBA(150, 158, 172, 1)
            DisabledFill: =RGBA(232, 236, 243, 1)
            DisplayMode: =If(varSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =48
            HoverColor: =RGBA(56, 96, 178, 1)
            HoverFill: =RGBA(240, 244, 251, 1)
            OnSelect: |-
              =Set(varSaving, true);
              Set(varV1, Trim(If(tglSvV1Manual.Value, txtSvV1Name.Text, Coalesce(cboSvV1.Selected.VendorName, ""))));
              Set(varV2, Trim(If(tglSvV2Manual.Value, txtSvV2Name.Text, Coalesce(cboSvV2.Selected.VendorName, ""))));
              Set(varV3, Trim(If(tglSvV3Manual.Value, txtSvV3Name.Text, Coalesce(cboSvV3.Selected.VendorName, ""))));
              Set(varV4, Trim(If(tglSvV4Manual.Value, txtSvV4Name.Text, Coalesce(cboSvV4.Selected.VendorName, ""))));
              // Stored as typed, minus outer whitespace. Several addresses may share one
              // field, separated by semicolons; the check below validates every one of them.
              Set(varE1, Trim(txtSvV1Email.Text));
              Set(varE2, Trim(txtSvV2Email.Text));
              Set(varE3, Trim(txtSvV3Email.Text));
              Set(varE4, Trim(txtSvV4Email.Text));
              ClearCollect(
                  colSvSlots,
                  { Slot: "Vendor 1", VName: varV1, VEmail: varE1 },
                  { Slot: "Vendor 2", VName: varV2, VEmail: varE2 },
                  { Slot: "Vendor 3", VName: varV3, VEmail: varE3 },
                  { Slot: "Vendor 4", VName: varV4, VEmail: varE4 }
              );
              ClearCollect(colSvFilled, Filter(colSvSlots, !IsBlank(VName)));
              If(
                  CountRows(colSvFilled) = 0,
                  Notify("Add at least one vendor before saving.", NotificationType.Error);
                  Set(varSaving, false),
                  CountRows(Filter(colSvFilled, IsBlank(VEmail) || !IsMatch(VEmail, "^\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+(\s*;\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+)*\s*$"))) > 0,
                  Notify("Every vendor you list needs at least one valid email address. Separate multiple addresses with a semicolon.", NotificationType.Error);
                  Set(varSaving, false),
                  CountRows(colSvFilled) <> CountRows(Distinct(colSvFilled, Lower(VName))),
                  Notify("The same vendor is listed twice. Remove the duplicate before saving.", NotificationType.Error);
                  Set(varSaving, false),
                  Patch(
                      RFQ_Checklist,
                      If(IsBlank(varChecklist), Defaults(RFQ_Checklist), varChecklist),
                      {
                          Title: varSelectedRFQ.Title,
                          RFQID: varSelectedRFQ.ID,
                          RFQSentDate: dteSvSentDate.SelectedDate,
                          Vendor1Name: varV1,
                          Vendor1Email: If(IsBlank(varV1), Blank(), varE1),
                          Vendor1Currency: If(IsBlank(varV1), Blank(), varChecklist.Vendor1Currency),
                          Vendor1UnitPrice: If(IsBlank(varV1), Blank(), varChecklist.Vendor1UnitPrice),
                          Vendor1TotalPrice: If(IsBlank(varV1), Blank(), varChecklist.Vendor1TotalPrice),
                          Vendor1LeadTime: If(IsBlank(varV1), Blank(), varChecklist.Vendor1LeadTime),
                          Vendor1Status: If(
                              IsBlank(varV1),
                              Blank(),
                              If(
                                  Coalesce(varChecklist.Vendor1Name, "") <> varV1,
                                  { Value: "Awaiting reply" },
                                  Coalesce(varChecklist.Vendor1Status, { Value: "Awaiting reply" })
                              )
                          ),
                          Vendor2Name: varV2,
                          Vendor2Email: If(IsBlank(varV2), Blank(), varE2),
                          Vendor2Currency: If(IsBlank(varV2), Blank(), varChecklist.Vendor2Currency),
                          Vendor2UnitPrice: If(IsBlank(varV2), Blank(), varChecklist.Vendor2UnitPrice),
                          Vendor2TotalPrice: If(IsBlank(varV2), Blank(), varChecklist.Vendor2TotalPrice),
                          Vendor2LeadTime: If(IsBlank(varV2), Blank(), varChecklist.Vendor2LeadTime),
                          Vendor2Status: If(
                              IsBlank(varV2),
                              Blank(),
                              If(
                                  Coalesce(varChecklist.Vendor2Name, "") <> varV2,
                                  { Value: "Awaiting reply" },
                                  Coalesce(varChecklist.Vendor2Status, { Value: "Awaiting reply" })
                              )
                          ),
                          Vendor3Name: varV3,
                          Vendor3Email: If(IsBlank(varV3), Blank(), varE3),
                          Vendor3Currency: If(IsBlank(varV3), Blank(), varChecklist.Vendor3Currency),
                          Vendor3UnitPrice: If(IsBlank(varV3), Blank(), varChecklist.Vendor3UnitPrice),
                          Vendor3TotalPrice: If(IsBlank(varV3), Blank(), varChecklist.Vendor3TotalPrice),
                          Vendor3LeadTime: If(IsBlank(varV3), Blank(), varChecklist.Vendor3LeadTime),
                          Vendor3Status: If(
                              IsBlank(varV3),
                              Blank(),
                              If(
                                  Coalesce(varChecklist.Vendor3Name, "") <> varV3,
                                  { Value: "Awaiting reply" },
                                  Coalesce(varChecklist.Vendor3Status, { Value: "Awaiting reply" })
                              )
                          ),
                          Vendor4Name: varV4,
                          Vendor4Email: If(IsBlank(varV4), Blank(), varE4),
                          Vendor4Currency: If(IsBlank(varV4), Blank(), varChecklist.Vendor4Currency),
                          Vendor4UnitPrice: If(IsBlank(varV4), Blank(), varChecklist.Vendor4UnitPrice),
                          Vendor4TotalPrice: If(IsBlank(varV4), Blank(), varChecklist.Vendor4TotalPrice),
                          Vendor4LeadTime: If(IsBlank(varV4), Blank(), varChecklist.Vendor4LeadTime),
                          Vendor4Status: If(
                              IsBlank(varV4),
                              Blank(),
                              If(
                                  Coalesce(varChecklist.Vendor4Name, "") <> varV4,
                                  { Value: "Awaiting reply" },
                                  Coalesce(varChecklist.Vendor4Status, { Value: "Awaiting reply" })
                              )
                          ),
                          AwardVendor: If(
                              (varChecklist.AwardVendor.Value = "Vendor 1" && IsBlank(varV1))
                                  || (varChecklist.AwardVendor.Value = "Vendor 2" && IsBlank(varV2))
                                  || (varChecklist.AwardVendor.Value = "Vendor 3" && IsBlank(varV3))
                                  || (varChecklist.AwardVendor.Value = "Vendor 4" && IsBlank(varV4)),
                              Blank(),
                              varChecklist.AwardVendor
                          )
                      }
                  );
                  Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
                  Notify("Vendor list saved (" & CountRows(colSvFilled) & " vendor(s)).", NotificationType.Success, 3000);
                  Set(varSaving, false)
              )
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(56, 96, 178, 1)
            Size: =13
            Text: ="Save vendor list"
            Width: =324
            X: =24
            Y: =450
      - btnSvSend:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(214, 221, 233, 1)
            DisabledColor: =RGBA(150, 158, 172, 1)
            DisabledFill: =RGBA(232, 236, 243, 1)
            DisplayMode: =If(IsBlank(varChecklist.Vendor1Name) || varSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =56
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(varSaving, true);
              Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
              Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
              If(
                  IsBlank(varRFQRecord),
                  Notify("This RFQ no longer exists. Somebody may have deleted it. Go back to the queue and refresh.", NotificationType.Error, 6000);
                  Set(varSaving, false),

                  // Already sent. This button only corrects the recorded sent date,
                  // it never re-sends and never re-flips the status.
                  varRFQRecord.'RFQ status'.Value = "RFQ sent out",
                  Patch(RFQ_Checklist, varChecklist, { RFQSentDate: Coalesce(dteSvSentDate.SelectedDate, Today()) });
                  Set(varSelectedRFQ, LookUp(RFQ, ID = varRFQRecord.ID));
                  Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varRFQRecord.ID));
                  Set(varSaving, false);
                  Notify("Sent date updated.", NotificationType.Success, 3000);
                  Navigate(scrChecklist, ScreenTransition.Fade),

                  // Not sent yet. Build the recipient list from what is actually saved on
                  // THIS RFQ and open the preview. The status is only moved to "RFQ sent
                  // out" once the email really goes out, in SendEmail.OnSelect.
                  ClearCollect(
                      colSvMailTo,
                      Filter(
                          Table(
                              { E: Coalesce(varChecklist.Vendor1Email, "") },
                              { E: Coalesce(varChecklist.Vendor2Email, "") },
                              { E: Coalesce(varChecklist.Vendor3Email, "") },
                              { E: Coalesce(varChecklist.Vendor4Email, "") }
                          ),
                          !IsBlank(E)
                      )
                  );
                  Set(varSaving, false);
                  If(
                      CountRows(colSvMailTo) = 0,
                      Notify("Save the vendor list first. There are no vendor email addresses stored yet.", NotificationType.Warning, 4000),

                      Reset(rtePreview);
                      Set(varShowPreview, true)
                  )
              )
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =14
            Text: =If(varSelectedRFQ.'RFQ status'.Value = "RFQ sent out", "Update sent date and go to checklist", "Review and send RFQ to vendors")
            Width: =324
            X: =24
            Y: =518
      - recSvAttachCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =176
            Width: =324
            X: =24
            Y: =584
      - recSvAttachHead:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =32
            Width: =324
            X: =24
            Y: =584
      - lblSvAttachHead:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            PaddingLeft: =14
            Size: =11
            Text: ="Attachments from the requestor"
            Width: =324
            X: =24
            Y: =584
      - galSvDocs:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            Height: =64
            Items: =colSvDocs
            TemplatePadding: =0
            TemplateSize: =30
            Width: =308
            X: =32
            Y: =620
          Children:
            - lblSvDocName:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(56, 96, 178, 1)
                  Font: =Font.'Open Sans'
                  Height: =30
                  OnSelect: =Launch(ThisItem.FileLink)
                  Size: =9
                  Text: =ThisItem.FileName
                  Width: =308
      - lblSvDocsEmpty:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =39
            Size: =9
            Text: ="The requestor did not attach any documents."
            Visible: =CountRows(colSvDocs) = 0
            Width: =308
            X: =32
            Y: =617
      - lblSvAttachHint:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =34
            Size: =9
            Text: |-
              =If(
                  CountRows(colSvDocs) = 0,
                  "No files to send. The vendors get the email text only.",
                  CountRows(colSvDocs) & " file(s) go out with the RFQ email. Click a file to open it."
              )
            Width: =308
            X: =32
            Y: =721
      - lblSvLeftHint:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =28
            Size: =10
            Text: |-
              =If(
                  IsBlank(varChecklist.Vendor1Name),
                  "Save the vendor list first, the send button unlocks once at least one vendor is stored.",
                  "Vendors can be added, swapped or removed at any time; clearing a slot also clears that vendor's saved quote."
              )
            Width: =536
            X: =830
            Y: =717
      - recSvCard1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =112
            Width: =983
            X: =372
            Y: =88
      - recSvHead1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(11, 33, 84, 1)
            Height: =38
            Width: =983
            X: =372
            Y: =88
      - lblSvHead1:
          Control: Label@2.5.1
