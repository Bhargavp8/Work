      - rtePreview:
          Control: RichTextEditor@2.7.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Default: |-
              ="<p>Dear vendors,</p>
              <p><strong>Pratt &amp; Whitney Component Solutions Pte Ltd (PWCS) Request For Quotation</strong></p>
              <p>We would like to RFQ for the item below for PWCS. Appreciate if you could provide us the quotation by <strong>" & Text(varSelectedRFQ.RFQduedate, "dd mmm yyyy") & "</strong>.<br>
              Kindly quote our RFQ# <strong>" & Text(varSelectedRFQ.Title) & "</strong> in your quotation.</p>
              <table border=""1"" cellpadding=""8"" cellspacing=""0"" style=""border-collapse:collapse;width:100%;font-family:Segoe UI,Arial,sans-serif;font-size:13px;"">
                <tr style=""background-color:#1F2A44;color:#FFFFFF;"">
                  <th align=""left"" width=""50%"">Item Description</th>
                  <th align=""left"" width=""50%"">Other Info</th>
                </tr>
                <tr>
                  <td valign=""top"">" & PlainText(Coalesce(Text(varSelectedRFQ.Description), "")) & "</td>
                  <td valign=""top"">Quantity: " & Text(varSelectedRFQ.Quantity) & " " & Coalesce(Text(varSelectedRFQ.UOM), "") & "<br>Urgency: " & If(DateDiff(Today(), varSelectedRFQ.RFQduedate, TimeUnit.Days) <= 3, "Urgent", "Standard") & "<br>" & PlainText(Coalesce(Text(varSelectedRFQ.Remarks), "")) & "</td>
                </tr>
              </table>
              <p>Please contact <strong>" & Coalesce(Text(varSelectedRFQ.RequestorName), Text(varSelectedRFQ.'Created By'.DisplayName), "the requestor") & "</strong> (see email) for more details, if you need any other info. Their email address is as per cc-ed.</p>
              <p><strong>Requirements to be included in the quotation:</strong></p>
              <ul>
                <li>Quotation must be sent or forwarded only to PWCS BUYER at <a href=""mailto:pws.shq.quote@prattwhitney.com"">pws.shq.quote@prattwhitney.com</a></li>
                <li>Indicate RFQ Reference in quote as well as in email subject title. Note that emails without RFQ reference in subject will not be picked up by our system.</li>
                <li>Indicate the qty as per mentioned in the RFQ email</li>
                <li>Indicate Lead Time for the job, service or item</li>
                <li>State the work scope, materials, and other requirements highlighted by the requestor</li>
                <li>Quotation must have a validity period of 60 days</li>
                <li>Address quote to Pratt &amp; Whitney Component Solutions PL, 61 Seletar Aerospace View, Singapore 797560</li>
                <li>Pratt &amp; Whitney has a standard 90 days payment term and DDP shipping term which applies unbiased across Vendors, unless otherwise negotiated</li>
              </ul>
              <p><strong>Note for subcontracting:</strong></p>
              <ul>
                <li>If job awarded requires to be sub-contracted to third parties</li>
                <li>Per export control requirement, please provide the details of your Sub-contractor (Company Name and address) for screening</li>
              </ul>
              <p><strong>Quotation Submission Reminder</strong></p>
              <p>All quotations are treated as confidential documents and must be attention and sent directly to the Buyer. You are not allowed to send any quotations to the requestor directly nor copy them in the email when quotations are submitted to the Buyer.</p>
              <p>Failing to adhere to this instruction will result in your quotation being rejected and your proposal will not be considered for the job.</p>
              <p>We need to follow this strictly as we want to protect the confidentiality of your price offers and to ensure that your quote is competitively and fairly evaluated by the Buyer.</p>
              <p>Do indicate the requestor's name on the quotation to the Buyer, and if necessary, you may send a separate workscope proposal to the requestor without stating any pricing.</p>
              <p><strong>Reminder</strong></p>
              <ul>
                <li>Kindly ensure the above requirements are strictly adhered to avoid disqualification</li>
                <li>Make an appointment with the requestor if you are coming for a meeting or discussion</li>
                <li>Ensure that you are cleared for visit before coming to our facility</li>
              </ul>
              <p style=""color:#A32D2D;""><strong>IMPORTANT NOTE:</strong><br>
              Per Pratt &amp; Whitney Policy and UTC Code Of Ethics, any reported finding or suspected case of the following nature shall be subjected to investigation, which could lead to termination of service.</p>
              <ol>
                <li>Commercial pricing disclosure, sharing or discussion, not released by PWCS Purchasing</li>
                <li>Job carried out without PWCS official purchase order, or specific instruction by PWCS Purchasing</li>
                <li>Monetary or gift acceptance of any form, without obtaining prior approval from PWCS Ethics and Compliance Officer (ECO)</li>
              </ol>
              <p>Thank You and Best Regards,</p>
              <p style=""font-family:Segoe UI,Arial,sans-serif;font-size:13px;"">
              <strong>" & Coalesce(Text(Office365Users.MyProfileV2().displayName), User().FullName) & "</strong><br>
              Buyer<br>
              O: " & Coalesce(Text(First(Office365Users.MyProfileV2().businessPhones).Value), "") & "<br>
              C: " & Coalesce(Text(Office365Users.MyProfileV2().mobilePhone), "") & "<br>
              <a href=""mailto:" & varMyMail & """>" & varMyMail & "</a><br><br>
              <strong>Pratt &amp; Whitney | An RTX Business</strong><br>
              Pratt &amp; Whitney Component Solutions Pte Ltd<br>
              61 Seletar Aerospace View, Singapore 797560<br>
              <a href=""https://www.rtx.com"">RTX.com</a>
              </p>
              <p style=""font-size:11px;color:#606A7E;"">
              This message may contain RTX proprietary, business confidential, and/or privileged information. Unless you are the addressee (or authorized to receive mail for the addressee), you should not use, copy, or disclose to anyone this message or any information contained in this message. If you have received this message in error, please advise the sender by reply e-mail and delete this message; you should not otherwise use, distribute, retransmit, or reproduce this email. Thank you for your cooperation.<br><br>
              This document does not contain any export regulated technical data.
              </p>"
            Height: =430
            Visible: =varShowPreview
            Width: =780
            X: =293
            Y: =152
