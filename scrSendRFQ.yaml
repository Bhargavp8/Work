      - SendEmail:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            DisplayMode: =If(IsBlank(Trim(PlainText(rtePreview.HtmlText))) || varSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(59, 109, 17, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(59, 109, 17, 1), -20%)
            OnSelect: |-
              =Set(varSaving, true);
              Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
              Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
              // Rebuild the recipient list here, from the checklist row of THIS RFQ, at the
              // moment of sending. A collection left behind by another button can still hold
              // the previous RFQ's vendors, which would mail this RFQ to the wrong companies.
              ClearCollect(
                  colSvMailTo,
                  Filter(
                      Table(
                          { E: Coalesce(varChecklist.Vendor1Email, "") },
                          { E: Coalesce(varChecklist.Vendor2Email, "") },
                          { E: Coalesce(varChecklist.Vendor3Email, "") },
                          { E: Coalesce(varChecklist.Vendor4Email, "") }
                      ),
                      !IsBlank(E)
                  )
              );
              Set(varSvRequestor, Coalesce(varRFQRecord.'Requestor Email', varRFQRecord.'Created By'.Email, ""));
              If(
                  IsBlank(varRFQRecord),
                  Notify("This RFQ no longer exists. Somebody may have deleted it. Nothing was sent.", NotificationType.Error, 6000);
                  Set(varSaving, false),

                  CountRows(colSvMailTo) = 0,
                  Notify("No vendor email addresses are saved on this RFQ, so there is nobody to send to. Nothing was sent. Save the vendor list first.", NotificationType.Error, 8000);
                  Set(varSaving, false);
                  Set(varShowPreview, false),

                  IsBlank(varSvRequestor),
                  Notify("This RFQ has no requestor email address, so the requestor cannot be copied. Nothing was sent. Fix the RFQ record first.", NotificationType.Error, 8000);
                  Set(varSaving, false);
                  Set(varShowPreview, false),

                  SendRFQToVendors.Run(
                      Concat(colSvMailTo, E, ";"),
                      varSvRequestor,
                      "RFQ " & varRFQRecord.Title & " . Reply by " & Text(varRFQRecord.RFQduedate, "dd mmm yyyy"),
                      rtePreview.HtmlText,
                      varMyMail,
                      varRFQRecord.ID,
                      varRFQRecord.Title
                  );
                  // Status only moves once the mail has actually gone out.
                  Patch(
                      RFQ,
                      varRFQRecord,
                      {
                          'RFQ status': { Value: "RFQ sent out" },
                          AwaitingAction: { Value: "Vendor" },
                          'Assigned Buyer': varMyMail,
                          ActivityLog: Left(Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   RFQ emailed to " & CountRows(colSvMailTo) & " vendor(s)" & Char(10) & Coalesce(varRFQRecord.ActivityLog, ""), 30000)
                      }
                  );
                  Patch(RFQ_Checklist, varChecklist, { RFQSentDate: Coalesce(dteSvSentDate.SelectedDate, Today()) });
                  Set(varSelectedRFQ, LookUp(RFQ, ID = varRFQRecord.ID));
                  Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varRFQRecord.ID));
                  Set(varSaving, false);
                  Notify("RFQ sent to " & CountRows(colSvMailTo) & " vendor(s). Vendors are on BCC and cannot see each other.", NotificationType.Success, 5000);
                  Set(varShowPreview, false);
                  Navigate(scrChecklist, ScreenTransition.Fade)
              )
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Size: =12
            Text: ="Send to vendors"
            Visible: =varShowPreview
            Width: =200
            X: =869
            Y: =608
