Screens:
  scrAwardConfirm:
    Properties:
      Fill: =RGBA(238, 242, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
        Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
        Set(varShowAlternate, false);
        Set(varAwardConfirm, Blank());
        Set(varSaving, false);
        Reset(txtAwPreferredVendor);
        Reset(txtAwAlternateJust);
        // Files the buyer attached for each vendor (RFQ_VendorDocs).
        Set(varAwShowDocs, false);
        ClearCollect(
            colAwDocs,
            ForAll(
                Filter(
                    Table(
                        { Slot: "Vendor 1", VendorName: Coalesce(varChecklist.Vendor1Name, "") },
                        { Slot: "Vendor 2", VendorName: Coalesce(varChecklist.Vendor2Name, "") },
                        { Slot: "Vendor 3", VendorName: Coalesce(varChecklist.Vendor3Name, "") },
                        { Slot: "Vendor 4", VendorName: Coalesce(varChecklist.Vendor4Name, "") }
                    ),
                    !IsBlank(VendorName)
                ) As S,
                {
                    Slot: S.Slot,
                    VendorName: S.VendorName,
                    Files: With(
                        { r: LookUp(RFQ_VendorDocs, RFQID = varSelectedRFQ.ID && Source = "Buyer" && Title = S.VendorName) },
                        If(IsBlank(r), 0, CountRows(r.Attachments))
                    )
                }
            )
        )
    Children:
      - recAwTopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(31, 42, 68, 1)
            Height: =64
            Width: =1366
      - btnAwBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate(scrEditRFQ, ScreenTransition.Fade)
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =12
            Text: ="Back"
            Width: =100
            X: =24
            Y: =14
      - lblAwTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =18
            Text: =varSelectedRFQ.Title & "   ·   Confirm the award"
            Width: =620
            X: =264
      - recAwSummary:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =60
            Width: =1318
            X: =24
            Y: =88
      - lblAwSummary:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(43, 54, 78, 1)
            Font: =Font.'Open Sans'
            Height: =60
            PaddingLeft: =16
            PaddingRight: =16
            Size: =11
            Text: |-
              =varSelectedRFQ.Description & Char(10) &
              varSelectedRFQ.Quantity & " " & Coalesce(varSelectedRFQ.UOM, "") &
              "     ·     " & With(
                  { d: DateDiff(Today(), varSelectedRFQ.'RFQ  due date', TimeUnit.Days) },
                  If(
                      varSelectedRFQ.'RFQ status'.Value in ["RFQ closed/completed", "RFQ cancelled"], "Closed",
                      IsBlank(varSelectedRFQ.'RFQ  due date'), "No due date set",
                      d < 0, "OVERDUE by " & Abs(d) & If(Abs(d) = 1, " day", " days"),
                      d = 0, "DUE TODAY",
                      d <= 3, "URGENT, due in " & d & If(d = 1, " day", " days"),
                      "Due in " & d & " days"
                  )
              ) &
              "     ·     Due " & Text(varSelectedRFQ.'RFQ  due date', "dd mmm yyyy") &
              "     ·     Buyer: " & Coalesce(varSelectedRFQ.'Assigned Buyer', "not assigned")
            Width: =1318
            X: =24
            Y: =88
      - recAwQuotesCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =198
            Width: =660
            X: =24
            Y: =168
      - lblAwQuotesHead:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =38
            PaddingLeft: =16
            Text: ="Quotes received"
            Width: =660
            X: =24
            Y: =168
      - lblAwV1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varChecklist.AwardVendor.Value = "Vendor 1", ColorValue("#3B6D11"), RGBA(43, 54, 78, 1))
            Fill: =If(varChecklist.AwardVendor.Value = "Vendor 1", RGBA(226, 242, 218, 1), RGBA(0, 0, 0, 0))
            Font: =Font.'Open Sans'
            FontWeight: =If(varChecklist.AwardVendor.Value = "Vendor 1", FontWeight.Semibold, FontWeight.Normal)
            Height: =38
            PaddingLeft: =16
            Size: =11
            Text: |-
              =If(
                  IsBlank(varChecklist.Vendor1TotalPrice),
                  Coalesce(varChecklist.Vendor1Name, ",") & "   ·   no quote",
                  varChecklist.Vendor1Name & "   ·   " & Text(varChecklist.Vendor1TotalPrice * LookUp('Currency Rate', Currency = varChecklist.Vendor1Currency.Value).CurrencyRate, "#,##0.00") & " USD   ·   " & varChecklist.Vendor1LeadTime & " days"
              ) & If(varChecklist.AwardVendor.Value = "Vendor 1", "    ★ RECOMMENDED", "")
            Width: =660
            X: =24
            Y: =210
      - lblAwV2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varChecklist.AwardVendor.Value = "Vendor 2", ColorValue("#3B6D11"), RGBA(43, 54, 78, 1))
            Fill: =If(varChecklist.AwardVendor.Value = "Vendor 2", RGBA(226, 242, 218, 1), RGBA(0, 0, 0, 0))
            Font: =Font.'Open Sans'
            FontWeight: =If(varChecklist.AwardVendor.Value = "Vendor 2", FontWeight.Semibold, FontWeight.Normal)
            Height: =38
            PaddingLeft: =16
            Size: =11
            Text: |-
              =If(
                  IsBlank(varChecklist.Vendor2TotalPrice),
                  varChecklist.Vendor2Name & "   ·   no quote",
                  varChecklist.Vendor2Name & "   ·   " & Text(varChecklist.Vendor2TotalPrice * LookUp('Currency Rate', Currency = varChecklist.Vendor2Currency.Value).CurrencyRate, "#,##0.00") & " USD   ·   " & varChecklist.Vendor2LeadTime & " days"
              ) & If(varChecklist.AwardVendor.Value = "Vendor 2", "    ★ RECOMMENDED", "")
            Visible: =!IsBlank(varChecklist.Vendor2Name)
            Width: =660
            X: =24
            Y: =248
      - lblAwV3:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varChecklist.AwardVendor.Value = "Vendor 3", ColorValue("#3B6D11"), RGBA(43, 54, 78, 1))
            Fill: =If(varChecklist.AwardVendor.Value = "Vendor 3", RGBA(226, 242, 218, 1), RGBA(0, 0, 0, 0))
            Font: =Font.'Open Sans'
            FontWeight: =If(varChecklist.AwardVendor.Value = "Vendor 3", FontWeight.Semibold, FontWeight.Normal)
            Height: =38
            PaddingLeft: =16
            Size: =11
            Text: |-
              =If(
                  IsBlank(varChecklist.Vendor3TotalPrice),
                  varChecklist.Vendor3Name & "   ·   no quote",
                  varChecklist.Vendor3Name & "   ·   " & Text(varChecklist.Vendor3TotalPrice * LookUp('Currency Rate', Currency = varChecklist.Vendor3Currency.Value).CurrencyRate, "#,##0.00") & " USD   ·   " & varChecklist.Vendor3LeadTime & " days"
              ) & If(varChecklist.AwardVendor.Value = "Vendor 3", "    ★ RECOMMENDED", "")
            Visible: =!IsBlank(varChecklist.Vendor3Name)
            Width: =660
            X: =24
            Y: =286
      - lblAwV4:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =If(varChecklist.AwardVendor.Value = "Vendor 4", ColorValue("#3B6D11"), RGBA(43, 54, 78, 1))
            Fill: =If(varChecklist.AwardVendor.Value = "Vendor 4", RGBA(226, 242, 218, 1), RGBA(0, 0, 0, 0))
            Font: =Font.'Open Sans'
            FontWeight: =If(varChecklist.AwardVendor.Value = "Vendor 4", FontWeight.Semibold, FontWeight.Normal)
            Height: =38
            PaddingLeft: =16
            Size: =11
            Text: |-
              =If(
                  IsBlank(varChecklist.Vendor4TotalPrice),
                  varChecklist.Vendor4Name & "   ·   no quote",
                  varChecklist.Vendor4Name & "   ·   " & Text(varChecklist.Vendor4TotalPrice * LookUp('Currency Rate', Currency = varChecklist.Vendor4Currency.Value).CurrencyRate, "#,##0.00") & " USD   ·   " & varChecklist.Vendor4LeadTime & " days"
              ) & If(varChecklist.AwardVendor.Value = "Vendor 4", "    ★ RECOMMENDED", "")
            Visible: =!IsBlank(varChecklist.Vendor4Name)
            Width: =660
            X: =24
            Y: =324
      - recAwRecCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(59, 109, 17, 1)
            BorderThickness: =2
            Fill: =RGBA(255, 255, 255, 1)
            Height: =200
            Width: =660
            X: =24
            Y: =386
      - lblAwRecHead:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(59, 109, 17, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =38
            PaddingLeft: =16
            Size: =15
            Text: |-
              ="★ Buyer recommends: " & Switch(
                  varChecklist.AwardVendor.Value,
                  "Vendor 1", varChecklist.Vendor1Name,
                  "Vendor 2", varChecklist.Vendor2Name,
                  "Vendor 3", varChecklist.Vendor3Name,
                  "Vendor 4", varChecklist.Vendor4Name,
                  "no vendor selected yet"
              )
            Width: =660
            X: =24
            Y: =386
      - lblAwRecNotes:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(43, 54, 78, 1)
            Font: =Font.'Open Sans'
            Height: =150
            PaddingLeft: =16
            PaddingRight: =16
            Size: =11
            Text: =PlainText(Coalesce((varChecklist.BuyerNotes), "The buyer did not add a justification."))
            Width: =660
            X: =24
            Y: =430
      - lblAwPriorRequest:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =120
            Size: =10
            Text: |-
              =If(
                  IsBlank(varChecklist.RequestorDecision.Value),
                  "You have not responded to this RFQ yet.",
                  "Your last response: " & varChecklist.RequestorDecision.Value &
                  If(!IsBlank(varChecklist.PreferredVendorName), Char(10) & "You asked for: " & varChecklist.PreferredVendorName, "") &
                  If(!IsBlank(varChecklist.RequestorJustification), Char(10) & varChecklist.RequestorJustification, "")
              )
            Width: =660
            X: =24
            Y: =600
      - recAwDecisionCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =576
            Width: =634
            X: =708
            Y: =168
      - lblAwDecisionHead:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(11, 33, 84, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =38
            PaddingLeft: =16
            Text: ="Your decision"
            Width: =634
            X: =708
            Y: =168
      - btnAwConfirm:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(59, 109, 17, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(214, 221, 233, 1)
            DisabledColor: =RGBA(150, 158, 172, 1)
            DisabledFill: =RGBA(232, 236, 243, 1)
            DisplayMode: =If(IsBlank(varChecklist.AwardVendor.Value) || varSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(59, 109, 17, 1)
            Font: =Font.'Open Sans'
            Height: =64
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(59, 109, 17, 1), -20%)
            OnSelect: =Set(varAwardConfirm, "confirm")
            PressedColor: =RGBA(59, 109, 17, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =14
            Text: ="Accept the recommendation"
            Width: =586
            X: =732
            Y: =232
      - lblAwOr:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =32
            Size: =11
            Text: ="or"
            Width: =586
            X: =732
            Y: =304
      - btnAwAlternate:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 191, 0, 1)
            Color: =RGBA(43, 33, 0, 1)
            Fill: =RGBA(255, 191, 0, 1)
            Font: =Font.'Open Sans'
            Height: =56
            HoverColor: =RGBA(43, 33, 0, 1)
            HoverFill: =ColorFade(RGBA(255, 191, 0, 1), -15%)
            OnSelect: =Set(varShowAlternate, !varShowAlternate)
            PressedColor: =RGBA(255, 191, 0, 1)
            PressedFill: =RGBA(43, 33, 0, 1)
            Size: =13
            Text: =If(varShowAlternate, "Cancel, do not request an alternative", "Ask the buyer for a different vendor")
            Width: =586
            X: =732
            Y: =344
      - lblAwPreferredLbl:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =11
            Text: ="Vendor you would prefer (optional)"
            Visible: =varShowAlternate
            Width: =586
            X: =732
            Y: =424
      - txtAwPreferredVendor:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            Default: =varChecklist.PreferredVendorName
            Font: =Font.'Open Sans'
            Height: =38
            HintText: ="Vendor name"
            HoverBorderColor: =RGBA(56, 96, 178, 1)
            HoverFill: =RGBA(246, 249, 253, 1)
            Size: =12
            Visible: =varShowAlternate
            Width: =586
            X: =732
            Y: =448
      - lblAwJustLbl:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =11
            Text: ="Why. The buyer needs a reason to re quote. Required."
            Visible: =varShowAlternate
            Width: =586
            X: =732
            Y: =502
      - txtAwAlternateJust:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            Default: =varChecklist.RequestorJustification
            Font: =Font.'Open Sans'
            Height: =120
            HintText: ="Technical fit, past performance, delivery window..."
            HoverBorderColor: =RGBA(56, 96, 178, 1)
            HoverFill: =RGBA(246, 249, 253, 1)
            Mode: =TextMode.MultiLine
            Size: =12
            Visible: =varShowAlternate
            Width: =586
            X: =732
            Y: =526
      - btnAwSubmitAlt:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(214, 221, 233, 1)
            DisabledColor: =RGBA(150, 158, 172, 1)
            DisabledFill: =RGBA(232, 236, 243, 1)
            DisplayMode: =If(varSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =52
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  IsBlank(Trim(txtAwAlternateJust.Text)),
                  Notify("A justification is required before sending this back to the buyer.", NotificationType.Error),

                  Set(varSaving, true);
                  Patch(
                      RFQ_Checklist,
                      varChecklist,
                      {
                          RequestorDecision: { Value: "Alternate requested" },
                          PreferredVendorName: Trim(txtAwPreferredVendor.Text),
                          RequestorJustification: Trim(txtAwAlternateJust.Text)
                      }
                  );
                  Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
                  Patch(
                      RFQ,
                      Coalesce(varRFQRecord, varSelectedRFQ),
                      {
                          'RFQ status': { Value: "Re-RFQ" },
                          AwaitingAction: { Value: "Buyer" },
                          'ReRFQCount ': Coalesce(varRFQRecord.'ReRFQCount ', 0) + 1,
                          'ActivityLog ': Left(Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   requestor asked for a different vendor" & Char(10) & Coalesce(varRFQRecord.'ActivityLog ', ""), 30000)
                      }
                  );
                  // Hand the RFQ back to the buyer who worked it, or to the whole buyer
                  // group if no buyer has claimed it yet.
                  Set(varAwBuyer, Coalesce(varRFQRecord.'Assigned Buyer', Concat(Filter('PWS_SHQ Purchase Requisition SU', (Trim(Lower(Role)) = "buyer" || Trim(Lower(Role)) = "admin") && !IsBlank(ThisRecord.User.Email)), ThisRecord.User.Email, ";")));
                  If(
                      IsBlank(varAwBuyer),
                      Notify("Saved, but no buyer could be identified so nobody was emailed. Tell an administrator.", NotificationType.Warning, 8000),

                      SendRFQNotification.Run(
                          varAwBuyer,
                          varMyMail,
                          "Re-quote requested: " & varSelectedRFQ.Title,
                          "<p>The requestor has asked for a different vendor on <strong>" & varSelectedRFQ.Title & "</strong>. It is back in your queue as a re-quote.</p>
                          <table border=""1"" cellpadding=""8"" cellspacing=""0"" style=""border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:13px;"">
                            <tr><td><strong>Item</strong></td><td>" & PlainText(Coalesce(varSelectedRFQ.Description, "")) & "</td></tr>
                            <tr><td><strong>Quantity</strong></td><td>" & varSelectedRFQ.Quantity & " " & Coalesce(varSelectedRFQ.UOM, "") & "</td></tr>
                            <tr><td><strong>You recommended</strong></td><td>" & Switch(varChecklist.AwardVendor.Value, "Vendor 1", varChecklist.Vendor1Name, "Vendor 2", varChecklist.Vendor2Name, "Vendor 3", varChecklist.Vendor3Name, "Vendor 4", varChecklist.Vendor4Name, "not recorded") & "</td></tr>
                            <tr><td><strong>Requestor prefers</strong></td><td>" & Coalesce(Trim(txtAwPreferredVendor.Text), "no specific vendor named") & "</td></tr>
                            <tr><td><strong>Reason</strong></td><td>" & Trim(txtAwAlternateJust.Text) & "</td></tr>
                            <tr><td><strong>Requestor</strong></td><td>" & User().FullName & " (" & varMyMail & ")</td></tr>
                            <tr><td><strong>Re-quote number</strong></td><td>" & (Coalesce(varRFQRecord.'ReRFQCount ', 0) + 1) & "</td></tr>
                          </table>
                          <p><a href=""https://rtxusers.sharepoint.us/sites/PWS_SHQ-PW/Lists/RFQ/DispForm.aspx?ID=" & varSelectedRFQ.ID & """>Open this RFQ in SharePoint</a></p>",
                          varSelectedRFQ.ID
                      )
                  );
                  Set(varSaving, false);
                  Notify("Sent back to the buyer as a re quote request. The buyer has been emailed.", NotificationType.Success, 3000);
                  Navigate(scrHome, ScreenTransition.Fade)
              )
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =13
            Text: ="Send back to buyer"
            Visible: =varShowAlternate
            Width: =586
            X: =732
            Y: =664
      - lblAwFooterHint:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =80
            PaddingLeft: =4
            Size: =10
            Text: ="Accepting closes the RFQ and reminds you to raise the PR manually. If you accept by mistake, open the RFQ from the home screen and reopen it, nothing is permanently locked."
            Visible: =!varShowAlternate
            Width: =586
            X: =732
            Y: =424
      - recAwScrim:
          Control: Rectangle@2.3.0
