            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =248
            Visible: =!IsBlank(varAwardConfirm)
            Width: =520
            X: =423
            Y: =260
      - lblAwModalTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(24, 34, 56, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =46
            PaddingLeft: =28
            Size: =16
            Text: ="Confirm this award?"
            Visible: =!IsBlank(varAwardConfirm)
            Width: =520
            X: =423
            Y: =284
      - lblAwModalBody:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =92
            PaddingLeft: =28
            PaddingRight: =28
            Size: =12
            Text: |-
              ="This closes " & varSelectedRFQ.Title & " and awards " & Switch(
                  varChecklist.AwardVendor.Value,
                  "Vendor 1", varChecklist.Vendor1Name,
                  "Vendor 2", varChecklist.Vendor2Name,
                  "Vendor 3", varChecklist.Vendor3Name,
                  "Vendor 4", varChecklist.Vendor4Name,
                  "the recommended vendor"
              ) & ". You will still need to raise the PR manually. The RFQ can be reopened afterwards if needed."
            Visible: =!IsBlank(varAwardConfirm)
            Width: =520
            X: =423
            Y: =330
      - btnAwModalNo:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            Color: =RGBA(56, 96, 178, 1)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverColor: =RGBA(56, 96, 178, 1)
            HoverFill: =RGBA(240, 244, 251, 1)
