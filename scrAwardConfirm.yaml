            Y: =440
      - btnAwModalYes:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(59, 109, 17, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(59, 109, 17, 1)
            Font: =Font.'Open Sans'
            Height: =44
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(59, 109, 17, 1), -20%)
            OnSelect: |-
              =Set(varSaving, true);
              Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
              Set(varAwardedTotal,
                  Switch(
                      varChecklist.AwardVendor.Value,
                      "Vendor 1", varChecklist.Vendor1TotalPrice,
                      "Vendor 2", varChecklist.Vendor2TotalPrice,
                      "Vendor 3", varChecklist.Vendor3TotalPrice,
                      "Vendor 4", varChecklist.Vendor4TotalPrice
                  )
              );
              If(
                  IsBlank(varRFQRecord),
                  Notify("This RFQ no longer exists. Somebody may have deleted it. Nothing was awarded.", NotificationType.Error, 6000);
                  Set(varAwardConfirm, Blank());
                  Set(varSaving, false),

                  IsBlank(varChecklist.AwardVendor),
                  Notify("There is no recommended vendor on this RFQ yet, so there is nothing to award. Ask the buyer to send a recommendation.", NotificationType.Error, 6000);
                  Set(varAwardConfirm, Blank());
                  Set(varSaving, false),

                  IsBlank(varAwardedTotal) || varAwardedTotal <= 0,
                  Notify("The recommended vendor has no price recorded. Send it back to the buyer rather than awarding a blank quote.", NotificationType.Error, 7000);
                  Set(varAwardConfirm, Blank());
                  Set(varSaving, false),

                  Patch(RFQ_Checklist, varChecklist, { RequestorDecision: { Value: "Confirmed" } });
                  Patch(
                      RFQ,
                      varRFQRecord,
                      {
                          'RFQ status': { Value: "RFQ closed/completed" },
                          AwaitingAction: { Value: "None" },
                          'ActivityLog ': Left(Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   award confirmed" & Char(10) & Coalesce(varRFQRecord.'ActivityLog ', ""), 30000)
                      }
                  );
                  // Closing the RFQ is the buyer's cue to place the order. They are not
                  // watching this screen, so it has to be an email.
                  Set(varAwBuyer, Coalesce(varRFQRecord.'Assigned Buyer', Concat(Filter('PWS_SHQ Purchase Requisition SU', (Trim(Lower(Role)) = "buyer" || Trim(Lower(Role)) = "admin") && !IsBlank(ThisRecord.User.Email)), ThisRecord.User.Email, ";")));
                  Set(varAwVendorName,
                      Switch(
                          varChecklist.AwardVendor.Value,
                          "Vendor 1", varChecklist.Vendor1Name,
                          "Vendor 2", varChecklist.Vendor2Name,
                          "Vendor 3", varChecklist.Vendor3Name,
                          "Vendor 4", varChecklist.Vendor4Name,
                          "the recommended vendor"
                      )
                  );
                  If(
                      IsBlank(varAwBuyer),
                      Notify("Award saved, but no buyer could be identified so nobody was emailed. Tell an administrator.", NotificationType.Warning, 8000),

                      SendRFQNotification.Run(
                          varAwBuyer,
                          varMyMail,
                          "Award confirmed: " & varSelectedRFQ.Title & "   (" & varAwVendorName & ")",
                          "<p>The requestor has accepted your recommendation on <strong>" & varSelectedRFQ.Title & "</strong>. The RFQ is now closed.</p>
                          <table border=""1"" cellpadding=""8"" cellspacing=""0"" style=""border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:13px;"">
                            <tr><td><strong>Item</strong></td><td>" & PlainText(Coalesce(varSelectedRFQ.Description, "")) & "</td></tr>
                            <tr><td><strong>Quantity</strong></td><td>" & varSelectedRFQ.Quantity & " " & Coalesce(varSelectedRFQ.UOM, "") & "</td></tr>
                            <tr><td><strong>Awarded to</strong></td><td>" & varAwVendorName & "</td></tr>
                            <tr><td><strong>Quoted total</strong></td><td>" & Text(varAwardedTotal, "#,##0.00") & "</td></tr>
                            <tr><td><strong>Confirmed by</strong></td><td>" & User().FullName & " (" & varMyMail & ")</td></tr>
                          </table>
                          <p>The requestor has been reminded to raise the purchase requisition.</p>
                          <p><a href=""https://rtxusers.sharepoint.us/sites/PWS_SHQ-PW/Lists/RFQ/DispForm.aspx?ID=" & varSelectedRFQ.ID & """>Open this RFQ in SharePoint</a></p>",
                          varSelectedRFQ.ID
                      )
                  );
                  Set(varAwardConfirm, Blank());
                  Set(varSaving, false);
                  Set(varSelectedRFQ, LookUp(RFQ, ID = varRFQRecord.ID));
                  Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varRFQRecord.ID));
                  Notify("Award confirmed and the buyer has been emailed. Raise the purchase requisition next.", NotificationType.Success, 5000);
                  Navigate(scrEditRFQ, ScreenTransition.Fade)
              )
            PressedColor: =RGBA(59, 109, 17, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =12
            Text: ="Yes, award it"
            Visible: =!IsBlank(varAwardConfirm)
            Width: =200
            X: =715
            Y: =440
