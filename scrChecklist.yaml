                  colCompare,
                  { Vendor: "Vendor 1", VName: varChecklist.Vendor1Name, Cur: If(IsBlank(cboCkV1Cur.Selected), "", cboCkV1Cur.Selected.Title), Raw: If(IsBlank(txtCkV1Total.Text) || !IsNumeric(txtCkV1Total.Text), Blank(), Value(txtCkV1Total.Text)) },
                  { Vendor: "Vendor 2", VName: varChecklist.Vendor2Name, Cur: If(IsBlank(cboCkV2Cur.Selected), "", cboCkV2Cur.Selected.Title), Raw: If(IsBlank(txtCkV2Total.Text) || !IsNumeric(txtCkV2Total.Text), Blank(), Value(txtCkV2Total.Text)) },
                  { Vendor: "Vendor 3", VName: varChecklist.Vendor3Name, Cur: If(IsBlank(cboCkV3Cur.Selected), "", cboCkV3Cur.Selected.Title), Raw: If(IsBlank(txtCkV3Total.Text) || !IsNumeric(txtCkV3Total.Text), Blank(), Value(txtCkV3Total.Text)) },
                  { Vendor: "Vendor 4", VName: varChecklist.Vendor4Name, Cur: If(IsBlank(cboCkV4Cur.Selected), "", cboCkV4Cur.Selected.Title), Raw: If(IsBlank(txtCkV4Total.Text) || !IsNumeric(txtCkV4Total.Text), Blank(), Value(txtCkV4Total.Text)) }
              );
              ClearCollect(
                  colCompareRated,
                  ForAll(
                      Filter(colCompare, !IsBlank(VName) && !IsBlank(Raw) && Cur <> ""),
                      {
                          Vendor: Vendor,
                          Cur: Cur,
                          Raw: Raw,
                          Rate: LookUp('Currency Rate', Title = Cur).field_1
                      }
                  )
              );
              ClearCollect(colCompareBad, Filter(colCompareRated, IsBlank(Rate) || Rate = 0));
              If(
                  CountRows(colCompareRated) = 0,
                  Set(varCheapestVendor, Blank());
                  Notify("Enter a total price and a currency for at least one vendor first.", NotificationType.Warning, 4000),

                  CountRows(colCompareBad) > 0,
                  Set(varCheapestVendor, Blank());
                  Notify("No exchange rate found for " & Concat(colCompareBad, Cur, ", ") & ". Add the rate to the Currency Rate list and compare again. Nothing has been selected.", NotificationType.Error, 8000),

                  Set(varCheapestVendor, First(Sort(colCompareRated, Raw * Rate, SortOrder.Ascending)).Vendor);
