      - btnCkSubmit:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(214, 221, 233, 1)
            DisabledColor: =RGBA(150, 158, 172, 1)
            DisabledFill: =RGBA(232, 236, 243, 1)
            DisplayMode: =If(varSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =64
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  IsBlank(cboCkAward.Selected),
                  Notify("Select the vendor you are recommending before sending.", NotificationType.Error),

                  IsBlank(Trim(txtCkNotes.Text)),
                  Notify("Add a justification, the requestor sees this when deciding.", NotificationType.Error),

                  // The requestor cannot accept an award with no price: scrAwardConfirm
                  // refuses it. Catch that here rather than sending them a dead end.
                  IsBlank(
                      Switch(
                          cboCkAward.Selected.Slot,
                          "Vendor 1", txtCkV1Total.Text,
                          "Vendor 2", txtCkV2Total.Text,
                          "Vendor 3", txtCkV3Total.Text,
                          "Vendor 4", txtCkV4Total.Text
                      )
                  ) || Value(
                      Switch(
                          cboCkAward.Selected.Slot,
                          "Vendor 1", txtCkV1Total.Text,
                          "Vendor 2", txtCkV2Total.Text,
                          "Vendor 3", txtCkV3Total.Text,
                          "Vendor 4", txtCkV4Total.Text
                      )
                  ) <= 0,
                  Notify("Enter a total price for " & cboCkAward.Selected.VendorName & " before recommending them. The requestor cannot accept an award with no price.", NotificationType.Error, 7000),

                  IsBlank(
                      Switch(
                          cboCkAward.Selected.Slot,
                          "Vendor 1", cboCkV1Cur.Selected.Title,
                          "Vendor 2", cboCkV2Cur.Selected.Title,
                          "Vendor 3", cboCkV3Cur.Selected.Title,
                          "Vendor 4", cboCkV4Cur.Selected.Title
                      )
                  ),
                  Notify("Pick the currency for " & cboCkAward.Selected.VendorName & " before recommending them.", NotificationType.Error, 6000),

                  Set(varSaving, true);
                  Patch(
                      RFQ_Checklist,
                      varChecklist,
                      {
                          Vendor1Currency: If(IsBlank(cboCkV1Cur.Selected), Blank(), { Value: cboCkV1Cur.Selected.Title }), Vendor1UnitPrice: If(IsBlank(txtCkV1Unit.Text), Blank(), Value(txtCkV1Unit.Text)), Vendor1TotalPrice: If(IsBlank(txtCkV1Total.Text), Blank(), Value(txtCkV1Total.Text)), Vendor1LeadTime: If(IsBlank(txtCkV1Lead.Text), Blank(), Value(txtCkV1Lead.Text)),
                          Vendor2Currency: If(IsBlank(cboCkV2Cur.Selected), Blank(), { Value: cboCkV2Cur.Selected.Title }), Vendor2UnitPrice: If(IsBlank(txtCkV2Unit.Text), Blank(), Value(txtCkV2Unit.Text)), Vendor2TotalPrice: If(IsBlank(txtCkV2Total.Text), Blank(), Value(txtCkV2Total.Text)), Vendor2LeadTime: If(IsBlank(txtCkV2Lead.Text), Blank(), Value(txtCkV2Lead.Text)),
                          Vendor3Currency: If(IsBlank(cboCkV3Cur.Selected), Blank(), { Value: cboCkV3Cur.Selected.Title }), Vendor3UnitPrice: If(IsBlank(txtCkV3Unit.Text), Blank(), Value(txtCkV3Unit.Text)), Vendor3TotalPrice: If(IsBlank(txtCkV3Total.Text), Blank(), Value(txtCkV3Total.Text)), Vendor3LeadTime: If(IsBlank(txtCkV3Lead.Text), Blank(), Value(txtCkV3Lead.Text)),
                          Vendor4Currency: If(IsBlank(cboCkV4Cur.Selected), Blank(), { Value: cboCkV4Cur.Selected.Title }), Vendor4UnitPrice: If(IsBlank(txtCkV4Unit.Text), Blank(), Value(txtCkV4Unit.Text)), Vendor4TotalPrice: If(IsBlank(txtCkV4Total.Text), Blank(), Value(txtCkV4Total.Text)), Vendor4LeadTime: If(IsBlank(txtCkV4Lead.Text), Blank(), Value(txtCkV4Lead.Text)),

                          Vendor1Status: If(IsBlank(varChecklist.Vendor1Name), Blank(), If(IsBlank(cboCkV1Resp.Selected), { Value: "Awaiting reply" }, { Value: cboCkV1Resp.Selected.Value })),
                          Vendor2Status: If(IsBlank(varChecklist.Vendor2Name), Blank(), If(IsBlank(cboCkV2Resp.Selected), { Value: "Awaiting reply" }, { Value: cboCkV2Resp.Selected.Value })),
                          Vendor3Status: If(IsBlank(varChecklist.Vendor3Name), Blank(), If(IsBlank(cboCkV3Resp.Selected), { Value: "Awaiting reply" }, { Value: cboCkV3Resp.Selected.Value })),
                          Vendor4Status: If(IsBlank(varChecklist.Vendor4Name), Blank(), If(IsBlank(cboCkV4Resp.Selected), { Value: "Awaiting reply" }, { Value: cboCkV4Resp.Selected.Value })),
                          AwardVendor: { Value: cboCkAward.Selected.Slot },
                          BuyerNotes: Trim(txtCkNotes.Text)
                      }
                  );
                  Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
                  Set(varCkRequestor, Coalesce(varRFQRecord.'Requestor Email', varRFQRecord.'Created By'.Email, ""));
                  If(
                      IsBlank(varRFQRecord),
                      Notify("This RFQ no longer exists. Somebody may have deleted it. The quotes were not sent.", NotificationType.Error, 6000),
                      Patch(
                          RFQ,
                          varRFQRecord,
                          {
                              'RFQ status': { Value: "RFQ pending" },
                              AwaitingAction: { Value: "Requestor" },
                              ActivityLog: Left(Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   recommended " & cboCkAward.Selected.VendorName & Char(10) & Coalesce(varRFQRecord.ActivityLog, ""), 30000)
                          }
                      );
                      // The RFQ is now waiting on the requestor. Tell them, otherwise the
                      // handover is invisible until they next open the app.
                      If(
                          IsBlank(varCkRequestor),
                          Notify("Saved, but this RFQ has no requestor email address so nobody could be emailed.", NotificationType.Warning, 8000),

                          SendRFQNotification.Run(
                              varCkRequestor,
                              varMyMail,
                              "Action needed: quote recommendation for " & varRFQRecord.Title,
                              "<p>The buyer has finished sourcing <strong>" & varRFQRecord.Title & "</strong> and needs your decision.</p>
                              <table border=""1"" cellpadding=""8"" cellspacing=""0"" style=""border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:13px;"">
