      - btnCkNoQuotes:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 191, 0, 1)
            Color: =RGBA(133, 79, 11, 1)
            DisabledBorderColor: =RGBA(214, 221, 233, 1)
            DisabledColor: =RGBA(150, 158, 172, 1)
            DisabledFill: =RGBA(232, 236, 243, 1)
            DisplayMode: =If(varSaving, DisplayMode.Disabled, DisplayMode.Edit)
            Fill: =RGBA(255, 250, 235, 1)
            Font: =Font.'Open Sans'
            Height: =54
            HoverColor: =RGBA(133, 79, 11, 1)
            HoverFill: =RGBA(255, 244, 214, 1)
            OnSelect: |-
              =Set(varSaving, true);
              Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
              If(
                  IsBlank(varRFQRecord),
                  Notify("This RFQ no longer exists. Somebody may have deleted it.", NotificationType.Error, 6000);
                  Set(varSaving, false),

                  Patch(
                      RFQ_Checklist,
                      varChecklist,
                      {
                          Vendor1Status: If(IsBlank(varChecklist.Vendor1Name), Blank(), { Value: "No response" }),
                          Vendor2Status: If(IsBlank(varChecklist.Vendor2Name), Blank(), { Value: "No response" }),
                          Vendor3Status: If(IsBlank(varChecklist.Vendor3Name), Blank(), { Value: "No response" }),
                          Vendor4Status: If(IsBlank(varChecklist.Vendor4Name), Blank(), { Value: "No response" }),
                          BuyerNotes: Trim(txtCkNotes.Text)
                      }
                  );
                  Patch(
                      RFQ,
                      varRFQRecord,
                      {
                          'RFQ status': { Value: "RFQ pending" },
                          AwaitingAction: { Value: "Buyer" },
                          ActivityLog: Left(Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   no usable quotes received, vendor list needs rework" & Char(10) & Coalesce(varRFQRecord.ActivityLog, ""), 30000)
                      }
                  );
                  // Keep the requestor informed. Their due date is at risk and they have
                  // heard nothing since the RFQ went out to vendors.
                  Set(varCkRequestor, Coalesce(varRFQRecord.'Requestor Email', varRFQRecord.'Created By'.Email, ""));
                  If(
                      !IsBlank(varCkRequestor),
                      SendRFQNotification.Run(
                          varCkRequestor,
                          varMyMail,
                          "Update on " & varRFQRecord.Title & ": no usable quotes, re-sourcing",
                          "<p>No usable quotes came back from the vendors approached for <strong>" & varRFQRecord.Title & "</strong>.</p>
                          <p>The buyer is now approaching a different set of vendors. There is nothing for you to do right now, and this RFQ has <em>not</em> been cancelled.</p>
                          <table border=""1"" cellpadding=""8"" cellspacing=""0"" style=""border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:13px;"">
                            <tr><td><strong>Item</strong></td><td>" & PlainText(Coalesce(varRFQRecord.Description, "")) & "</td></tr>
                            <tr><td><strong>Originally needed by</strong></td><td>" & Text(varRFQRecord.RFQduedate, "dd mmm yyyy") & "</td></tr>
                            <tr><td><strong>Buyer note</strong></td><td>" & Coalesce(Trim(txtCkNotes.Text), "none") & "</td></tr>
                            <tr><td><strong>Buyer</strong></td><td>" & User().FullName & " (" & varMyMail & ")</td></tr>
                          </table>
                          <p>If your due date can no longer be met, contact the buyer directly.</p>
                          <p><a href=""https://rtxusers.sharepoint.us/sites/PWS_SHQ-PW/Lists/RFQ/DispForm.aspx?ID=" & varRFQRecord.ID & """>Open this RFQ in SharePoint</a></p>",
                          varRFQRecord.ID
                      )
                  );
                  Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
                  Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
                  Set(varSaving, false);
                  Notify("Logged and the requestor has been emailed. All four slots are marked as no response and the RFQ stays with you. Open Add or remove vendors to try a different vendor list.", NotificationType.Warning, 7000);
                  Navigate(scrSendRFQ, ScreenTransition.Fade)
              )
            PressedColor: =RGBA(255, 250, 235, 1)
            PressedFill: =RGBA(255, 191, 0, 1)
            Size: =12
            Text: ="No usable quotes. Try other vendors"
            Width: =300
            X: =24
            Y: =564
