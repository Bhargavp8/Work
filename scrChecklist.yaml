Screens:
  scrChecklist:
    Properties:
      Fill: =RGBA(238, 242, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
        Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
        Set(varCheapestVendor, Blank());
        Set(varSaving, false);
        Reset(cboCkV1Cur); Reset(txtCkV1Unit); Reset(txtCkV1Total); Reset(txtCkV1Lead);
        Reset(cboCkV2Cur); Reset(txtCkV2Unit); Reset(txtCkV2Total); Reset(txtCkV2Lead);
        Reset(cboCkV3Cur); Reset(txtCkV3Unit); Reset(txtCkV3Total); Reset(txtCkV3Lead);
        Reset(cboCkV4Cur); Reset(txtCkV4Unit); Reset(txtCkV4Total); Reset(txtCkV4Lead);
        Reset(cboCkV1Resp); Reset(cboCkV2Resp); Reset(cboCkV3Resp); Reset(cboCkV4Resp);
        Reset(cboCkAward); Reset(txtCkNotes)
    Children:
      - recCkTopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(31, 42, 68, 1)
            Height: =64
            Width: =1366
      - btnCkBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  IsBlank(varChecklist),
                  false,
                  Patch(
                      RFQ_Checklist,
                      varChecklist,
                      {
                          Vendor1Currency: If(IsBlank(cboCkV1Cur.Selected), Blank(), { Value: cboCkV1Cur.Selected.Title }), Vendor1UnitPrice: If(IsBlank(txtCkV1Unit.Text), Blank(), Value(txtCkV1Unit.Text)), Vendor1TotalPrice: If(IsBlank(txtCkV1Total.Text), Blank(), Value(txtCkV1Total.Text)), Vendor1LeadTime: If(IsBlank(txtCkV1Lead.Text), Blank(), Value(txtCkV1Lead.Text)),
                          Vendor2Currency: If(IsBlank(cboCkV2Cur.Selected), Blank(), { Value: cboCkV2Cur.Selected.Title }), Vendor2UnitPrice: If(IsBlank(txtCkV2Unit.Text), Blank(), Value(txtCkV2Unit.Text)), Vendor2TotalPrice: If(IsBlank(txtCkV2Total.Text), Blank(), Value(txtCkV2Total.Text)), Vendor2LeadTime: If(IsBlank(txtCkV2Lead.Text), Blank(), Value(txtCkV2Lead.Text)),
                          Vendor3Currency: If(IsBlank(cboCkV3Cur.Selected), Blank(), { Value: cboCkV3Cur.Selected.Title }), Vendor3UnitPrice: If(IsBlank(txtCkV3Unit.Text), Blank(), Value(txtCkV3Unit.Text)), Vendor3TotalPrice: If(IsBlank(txtCkV3Total.Text), Blank(), Value(txtCkV3Total.Text)), Vendor3LeadTime: If(IsBlank(txtCkV3Lead.Text), Blank(), Value(txtCkV3Lead.Text)),
                          Vendor4Currency: If(IsBlank(cboCkV4Cur.Selected), Blank(), { Value: cboCkV4Cur.Selected.Title }), Vendor4UnitPrice: If(IsBlank(txtCkV4Unit.Text), Blank(), Value(txtCkV4Unit.Text)), Vendor4TotalPrice: If(IsBlank(txtCkV4Total.Text), Blank(), Value(txtCkV4Total.Text)), Vendor4LeadTime: If(IsBlank(txtCkV4Lead.Text), Blank(), Value(txtCkV4Lead.Text)),
                          BuyerNotes: txtCkNotes.Text
                      }
                  );
                  Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
                  Notify("Quotes kept as a draft.", NotificationType.Information, 2000)
              );
              Navigate(scrBuyerQueue, ScreenTransition.Fade)
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =12
            Text: ="Back"
            Width: =100
            X: =24
            Y: =14
      - lblCkTitle:
          Control: Label@2.5.1
