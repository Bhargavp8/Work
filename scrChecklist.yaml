                                <tr><td><strong>Quantity</strong></td><td>" & varRFQRecord.Quantity & " " & Coalesce(varRFQRecord.UOM, "") & "</td></tr>
                                <tr><td><strong>Recommended vendor</strong></td><td>" & cboCkAward.Selected.VendorName & "</td></tr>
                                <tr><td><strong>Buyer justification</strong></td><td>" & Trim(txtCkNotes.Text) & "</td></tr>
                                <tr><td><strong>Buyer</strong></td><td>" & User().FullName & " (" & varMyMail & ")</td></tr>
                              </table>
                              <p>Open the RFQ app and use <strong>Review buyer recommendation and respond</strong> to accept the award or ask for a different vendor. Nothing is ordered until you accept.</p>
                              <p><a href=""https://rtxusers.sharepoint.us/sites/PWS_SHQ-PW/Lists/RFQ/DispForm.aspx?ID=" & varRFQRecord.ID & """>Open this RFQ in SharePoint</a></p>",
                              varRFQRecord.ID
                          )
                      )
                  );
                  Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
                  Set(varSaving, false);
                  Notify("Recommendation emailed to the requestor.", NotificationType.Success, 3000);
                  Navigate(scrBuyerQueue, ScreenTransition.Fade)
