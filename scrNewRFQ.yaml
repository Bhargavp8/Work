      - frmNwAttach:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            DataSource: =RFQ
            DefaultMode: =FormMode.New
            Height: =84
            Item: =Defaults(RFQ)
            NumberOfColumns: =1
            OnFailure: |-
              =Set(varSaving, false);
              Notify("The RFQ could not be saved. " & frmNwAttach.Error, NotificationType.Error, 8000)
            OnSuccess: |-
              =Set(varNewRFQ, frmNwAttach.LastSubmit);
              Set(varNwRFQNumber, "RFQ " & Text(Today(), "yyyy") & "-" & Text(varNewRFQ.ID, "0000"));
              Patch(
                  RFQ,
                  varNewRFQ,
                  {
                      Title: varNwRFQNumber,
                      Description: Trim(txtNwDescription.Text),
                      Quantity: Value(txtNwQuantity.Text),
                      UOM: Trim(txtNwUOM.Text),
                      Urgency: { Value: varNwUrgency },
                      'RFQ Raise Date': Today(),
                      RFQduedate: varNwDueDate,
                      'Sole Source': tglNwSoleSource.Value,
                      'Business Justification': If(tglNwSoleSource.Value, Trim(txtNwJustification.Text), Blank()),
                      'Requestor Email': varMyMail,
                      RequestorName: User().FullName,
                      ReRFQCount: 0,
                      ActivityLog: Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   RFQ raised with " & CountRows(attNwAttachments.Attachments) & " attachment(s)",
                      'RFQ status': { Value: "RFQ pending" },
                      AwaitingAction: { Value: "Buyer" },
                      'Recommend Vendor': Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, ""))),
                      RecommendVendorEmail: Trim(txtNwRec1Email.Text),
                      RecommendVendorRemarks: Trim(txtNwRec1Remarks.Text),
                      RecVendor2Name: Trim(If(tglNwRec2Manual.Value, txtNwRec2Name.Text, Coalesce(cboNwRec2.Selected.VendorName, ""))),
                      RecVendor2Email: Trim(txtNwRec2Email.Text),
                      RecVendor2Remarks: Trim(txtNwRec2Remarks.Text),
                      RecVendor3Name: Trim(If(tglNwRec3Manual.Value, txtNwRec3Name.Text, Coalesce(cboNwRec3.Selected.VendorName, ""))),
                      RecVendor3Email: Trim(txtNwRec3Email.Text),
                      RecVendor3Remarks: Trim(txtNwRec3Remarks.Text),
                      Remarks: Trim(txtNwRemarks.Text)
                  }
              );
              // Tell the buyers there is something in their queue. Without this the RFQ
              // sits unseen until somebody happens to open the Buyer Queue screen.
              Set(varNwBuyers, Concat(Filter('PWS_SHQ Purchase Requisition SU', (Trim(Lower(Role)) = "buyer" || Trim(Lower(Role)) = "admin") && !IsBlank(ThisRecord.User.Email)), ThisRecord.User.Email, ";"));
              If(
                  IsBlank(varNwBuyers),
                  Notify("RFQ saved, but no buyer is listed in the access list so nobody could be emailed. Tell an administrator.", NotificationType.Warning, 8000),

                  SendRFQNotification.Run(
                      varNwBuyers,
                      varMyMail,
                      "New RFQ raised: " & varNwRFQNumber & "   (needed by " & Text(varNwDueDate, "dd mmm yyyy") & ")",
                      "<p><strong>" & varNwRFQNumber & "</strong> has been raised and is waiting in the buyer queue.</p>
                      <table border=""1"" cellpadding=""8"" cellspacing=""0"" style=""border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:13px;"">
                        <tr><td><strong>Raised by</strong></td><td>" & User().FullName & " (" & varMyMail & ")</td></tr>
                        <tr><td><strong>Description</strong></td><td>" & Trim(txtNwDescription.Text) & "</td></tr>
                        <tr><td><strong>Quantity</strong></td><td>" & Trim(txtNwQuantity.Text) & " " & Trim(txtNwUOM.Text) & "</td></tr>
                        <tr><td><strong>Urgency</strong></td><td>" & varNwUrgency & "</td></tr>
                        <tr><td><strong>Needed by</strong></td><td>" & Text(varNwDueDate, "dd mmm yyyy") & "</td></tr>
                        <tr><td><strong>Sole source</strong></td><td>" & If(tglNwSoleSource.Value, "Yes. " & Trim(txtNwJustification.Text), "No") & "</td></tr>
                        <tr><td><strong>Suggested vendors</strong></td><td>" &
                        If(IsBlank(Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, "")))) && IsBlank(Trim(If(tglNwRec2Manual.Value, txtNwRec2Name.Text, Coalesce(cboNwRec2.Selected.VendorName, "")))) && IsBlank(Trim(If(tglNwRec3Manual.Value, txtNwRec3Name.Text, Coalesce(cboNwRec3.Selected.VendorName, "")))),
                            "none given",
                            If(IsBlank(Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, "")))), "", "1. " & Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, ""))) & " (" & Trim(txtNwRec1Email.Text) & ")" & If(IsBlank(Trim(txtNwRec1Remarks.Text)), "", " - " & Trim(txtNwRec1Remarks.Text)) & "<br>") &
                            If(IsBlank(Trim(If(tglNwRec2Manual.Value, txtNwRec2Name.Text, Coalesce(cboNwRec2.Selected.VendorName, "")))), "", "2. " & Trim(If(tglNwRec2Manual.Value, txtNwRec2Name.Text, Coalesce(cboNwRec2.Selected.VendorName, ""))) & " (" & Trim(txtNwRec2Email.Text) & ")" & If(IsBlank(Trim(txtNwRec2Remarks.Text)), "", " - " & Trim(txtNwRec2Remarks.Text)) & "<br>") &
                            If(IsBlank(Trim(If(tglNwRec3Manual.Value, txtNwRec3Name.Text, Coalesce(cboNwRec3.Selected.VendorName, "")))), "", "3. " & Trim(If(tglNwRec3Manual.Value, txtNwRec3Name.Text, Coalesce(cboNwRec3.Selected.VendorName, ""))) & " (" & Trim(txtNwRec3Email.Text) & ")" & If(IsBlank(Trim(txtNwRec3Remarks.Text)), "", " - " & Trim(txtNwRec3Remarks.Text)))
                        ) & "</td></tr>
                        <tr><td><strong>Attachments</strong></td><td>" & CountRows(attNwAttachments.Attachments) & "</td></tr>
                      </table>
                      <p><a href=""https://rtxusers.sharepoint.us/sites/PWS_SHQ-PW/Lists/RFQ/DispForm.aspx?ID=" & varNewRFQ.ID & """>Open this RFQ in SharePoint</a></p>",
                      varNewRFQ.ID
                  )
              );
              Set(varSaving, false);
              Notify(
                  varNwRFQNumber & " submitted with " & CountRows(attNwAttachments.Attachments) & " attachment(s). The buyers have been emailed. You can still edit it from the home screen.",
                  NotificationType.Success,
                  5000
              );
              Navigate(scrHome, ScreenTransition.Fade)
            Width: =382
            X: =48
            Y: =578
          Children:
            - Attachments_DataCard_New:
                Control: TypedDataCard@1.0.7
                Variant: ClassicAttachmentsEdit
                Properties:
