            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =46
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  IsBlank(Trim(txtNwDescription.Text)) || IsBlank(Trim(txtNwQuantity.Text)),
                  Notify("Description and quantity are both required.", NotificationType.Error),

                  !IsNumeric(txtNwQuantity.Text) || Value(txtNwQuantity.Text) <= 0,
                  Notify("Quantity must be a number greater than zero.", NotificationType.Error),

                  tglNwSoleSource.Value && IsBlank(Trim(txtNwJustification.Text)),
                  Notify("A sole source request needs a business justification.", NotificationType.Error),

                  IsBlank(varNwDueDate) || varNwDueDate < Today(),
                  Notify("Pick a due date of today or later.", NotificationType.Error),

                  // A suggested vendor the buyer cannot contact is not a suggestion.
                  (!IsBlank(Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, "")))) && IsBlank(Trim(txtNwRec1Email.Text)))
                      || (!IsBlank(Trim(If(tglNwRec2Manual.Value, txtNwRec2Name.Text, Coalesce(cboNwRec2.Selected.VendorName, "")))) && IsBlank(Trim(txtNwRec2Email.Text)))
                      || (!IsBlank(Trim(If(tglNwRec3Manual.Value, txtNwRec3Name.Text, Coalesce(cboNwRec3.Selected.VendorName, "")))) && IsBlank(Trim(txtNwRec3Email.Text))),
                  Notify("Every vendor you suggest needs an email address, otherwise the buyer cannot contact them.", NotificationType.Error, 6000),

                  (!IsBlank(Trim(txtNwRec1Email.Text)) && IsBlank(Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, "")))))
                      || (!IsBlank(Trim(txtNwRec2Email.Text)) && IsBlank(Trim(If(tglNwRec2Manual.Value, txtNwRec2Name.Text, Coalesce(cboNwRec2.Selected.VendorName, "")))))
                      || (!IsBlank(Trim(txtNwRec3Email.Text)) && IsBlank(Trim(If(tglNwRec3Manual.Value, txtNwRec3Name.Text, Coalesce(cboNwRec3.Selected.VendorName, ""))))),
                  Notify("You have entered a vendor email with no vendor name. Add the name or clear the email.", NotificationType.Error, 6000),

                  (!IsBlank(Trim(txtNwRec1Email.Text)) && !IsMatch(Trim(txtNwRec1Email.Text), "^\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+(\s*;\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+)*\s*$"))
                      || (!IsBlank(Trim(txtNwRec2Email.Text)) && !IsMatch(Trim(txtNwRec2Email.Text), "^\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+(\s*;\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+)*\s*$"))
                      || (!IsBlank(Trim(txtNwRec3Email.Text)) && !IsMatch(Trim(txtNwRec3Email.Text), "^\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+(\s*;\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+)*\s*$")),
                  Notify("Check the email address on the vendors you suggested. Separate multiple addresses with a semicolon.", NotificationType.Error, 6000),

                  (!IsBlank(Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, "")))) && Lower(Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, "")))) = Lower(Trim(If(tglNwRec2Manual.Value, txtNwRec2Name.Text, Coalesce(cboNwRec2.Selected.VendorName, "")))))
                      || (!IsBlank(Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, "")))) && Lower(Trim(If(tglNwRec1Manual.Value, txtNwRec1Name.Text, Coalesce(cboNwRec1.Selected.VendorName, "")))) = Lower(Trim(If(tglNwRec3Manual.Value, txtNwRec3Name.Text, Coalesce(cboNwRec3.Selected.VendorName, "")))))
                      || (!IsBlank(Trim(If(tglNwRec2Manual.Value, txtNwRec2Name.Text, Coalesce(cboNwRec2.Selected.VendorName, "")))) && Lower(Trim(If(tglNwRec2Manual.Value, txtNwRec2Name.Text, Coalesce(cboNwRec2.Selected.VendorName, "")))) = Lower(Trim(If(tglNwRec3Manual.Value, txtNwRec3Name.Text, Coalesce(cboNwRec3.Selected.VendorName, ""))))),
                  Notify("You have suggested the same vendor twice. Remove the duplicate.", NotificationType.Error, 6000),

                  // The record has to be created by the form, not by Patch, or the
                  // Attachments control has nothing to upload to. Everything else is
                  // patched onto the new record in frmNwAttach.OnSuccess.
                  Set(varSaving, true);
                  SubmitForm(frmNwAttach)
              )
            PressedColor: =RGBA(56, 96, 178, 1)
