      - btnEdSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(214, 221, 233, 1)
            DisabledColor: =RGBA(150, 158, 172, 1)
            DisabledFill: =RGBA(232, 236, 243, 1)
            DisplayMode: =If(varCanEdit && !varSaving, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =52
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(varSaving, true);
              If(
                  IsBlank(Trim(txtEdDescription.Text)) || IsBlank(Trim(txtEdQuantity.Text)),
                  Notify("Description and quantity are both required.", NotificationType.Error);
                  Set(varSaving, false),

                  !IsNumeric(txtEdQuantity.Text) || Value(txtEdQuantity.Text) <= 0,
                  Notify("Quantity must be a number greater than zero.", NotificationType.Error);
                  Set(varSaving, false),

                  tglEdSoleSource.Value && IsBlank(Trim(txtEdJustification.Text)),
                  Notify("A sole source request needs a business justification.", NotificationType.Error);
                  Set(varSaving, false),

                  IsBlank(dteEdDueDate.SelectedDate),
                  Notify("Pick a date you need this by.", NotificationType.Error);
                  Set(varSaving, false),

                  // Same rule the New RFQ screen enforces. A due date in the past means
                  // the buyer cannot tell a real deadline from a stale one.
                  dteEdDueDate.SelectedDate < Today() && dteEdDueDate.SelectedDate <> varSelectedRFQ.RFQduedate,
                  Notify("The new due date is in the past. Pick today or later.", NotificationType.Error);
                  Set(varSaving, false),

                  (!IsBlank(Trim(If(tglEdRec1Manual.Value, txtEdRec1Name.Text, Coalesce(cboEdRec1.Selected.VendorName, "")))) && IsBlank(Trim(txtEdRec1Email.Text)))
                      || (!IsBlank(Trim(If(tglEdRec2Manual.Value, txtEdRec2Name.Text, Coalesce(cboEdRec2.Selected.VendorName, "")))) && IsBlank(Trim(txtEdRec2Email.Text)))
                      || (!IsBlank(Trim(If(tglEdRec3Manual.Value, txtEdRec3Name.Text, Coalesce(cboEdRec3.Selected.VendorName, "")))) && IsBlank(Trim(txtEdRec3Email.Text))),
                  Notify("Every vendor you suggest needs an email address, otherwise the buyer cannot contact them.", NotificationType.Error, 6000);
                  Set(varSaving, false),

                  (!IsBlank(Trim(txtEdRec1Email.Text)) && IsBlank(Trim(If(tglEdRec1Manual.Value, txtEdRec1Name.Text, Coalesce(cboEdRec1.Selected.VendorName, "")))))
                      || (!IsBlank(Trim(txtEdRec2Email.Text)) && IsBlank(Trim(If(tglEdRec2Manual.Value, txtEdRec2Name.Text, Coalesce(cboEdRec2.Selected.VendorName, "")))))
                      || (!IsBlank(Trim(txtEdRec3Email.Text)) && IsBlank(Trim(If(tglEdRec3Manual.Value, txtEdRec3Name.Text, Coalesce(cboEdRec3.Selected.VendorName, ""))))),
                  Notify("You have entered a vendor email with no vendor name. Add the name or clear the email.", NotificationType.Error, 6000);
                  Set(varSaving, false),

                  (!IsBlank(Trim(txtEdRec1Email.Text)) && !IsMatch(Trim(txtEdRec1Email.Text), "^\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+(\s*;\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+)*\s*$"))
                      || (!IsBlank(Trim(txtEdRec2Email.Text)) && !IsMatch(Trim(txtEdRec2Email.Text), "^\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+(\s*;\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+)*\s*$"))
                      || (!IsBlank(Trim(txtEdRec3Email.Text)) && !IsMatch(Trim(txtEdRec3Email.Text), "^\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+(\s*;\s*[^@;\s]+@[^@;\s]+\.[^@;\s]+)*\s*$")),
                  Notify("Check the email address on the vendors you suggested. Separate multiple addresses with a semicolon.", NotificationType.Error, 6000);
                  Set(varSaving, false),

                  (!IsBlank(Trim(If(tglEdRec1Manual.Value, txtEdRec1Name.Text, Coalesce(cboEdRec1.Selected.VendorName, "")))) && Lower(Trim(If(tglEdRec1Manual.Value, txtEdRec1Name.Text, Coalesce(cboEdRec1.Selected.VendorName, "")))) = Lower(Trim(If(tglEdRec2Manual.Value, txtEdRec2Name.Text, Coalesce(cboEdRec2.Selected.VendorName, "")))))
                      || (!IsBlank(Trim(If(tglEdRec1Manual.Value, txtEdRec1Name.Text, Coalesce(cboEdRec1.Selected.VendorName, "")))) && Lower(Trim(If(tglEdRec1Manual.Value, txtEdRec1Name.Text, Coalesce(cboEdRec1.Selected.VendorName, "")))) = Lower(Trim(If(tglEdRec3Manual.Value, txtEdRec3Name.Text, Coalesce(cboEdRec3.Selected.VendorName, "")))))
                      || (!IsBlank(Trim(If(tglEdRec2Manual.Value, txtEdRec2Name.Text, Coalesce(cboEdRec2.Selected.VendorName, "")))) && Lower(Trim(If(tglEdRec2Manual.Value, txtEdRec2Name.Text, Coalesce(cboEdRec2.Selected.VendorName, "")))) = Lower(Trim(If(tglEdRec3Manual.Value, txtEdRec3Name.Text, Coalesce(cboEdRec3.Selected.VendorName, ""))))),
                  Notify("You have suggested the same vendor twice. Remove the duplicate.", NotificationType.Error, 6000);
                  Set(varSaving, false),

                  Set(varMaterialChange,
                      Trim(txtEdDescription.Text) <> Coalesce(varSelectedRFQ.Description, "")
                          || Value(txtEdQuantity.Text) <> varSelectedRFQ.Quantity
                          || Trim(txtEdUOM.Text) <> Coalesce(varSelectedRFQ.UOM, "")
                  );
                  Set(varWasSentOut, varSelectedRFQ.'RFQ status'.Value = "RFQ sent out");
                  Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
                  If(
                      IsBlank(varRFQRecord),
                      Notify("This RFQ no longer exists. Somebody may have deleted it. Nothing was saved.", NotificationType.Error, 6000);
                      Set(varSaving, false),

                  Patch(
                      RFQ,
                      varRFQRecord,
                      {
                          Description: Trim(txtEdDescription.Text),
                          Quantity: Value(txtEdQuantity.Text),
                          UOM: Trim(txtEdUOM.Text),
                          Urgency: { Value: If(DateDiff(Today(), dteEdDueDate.SelectedDate, TimeUnit.Days) <= 3, "Urgent", "Not urgent") },
                          RFQduedate: dteEdDueDate.SelectedDate,
                          'Sole Source': tglEdSoleSource.Value,
                          'Business Justification': If(tglEdSoleSource.Value, Trim(txtEdJustification.Text), Blank()),
                          'Recommend Vendor': Trim(If(tglEdRec1Manual.Value, txtEdRec1Name.Text, Coalesce(cboEdRec1.Selected.VendorName, ""))),
                          RecommendVendorEmail: Trim(txtEdRec1Email.Text),
                          RecommendVendorRemarks: Trim(txtEdRec1Remarks.Text),
                          RecVendor2Name: Trim(If(tglEdRec2Manual.Value, txtEdRec2Name.Text, Coalesce(cboEdRec2.Selected.VendorName, ""))),
                          RecVendor2Email: Trim(txtEdRec2Email.Text),
                          RecVendor2Remarks: Trim(txtEdRec2Remarks.Text),
                          RecVendor3Name: Trim(If(tglEdRec3Manual.Value, txtEdRec3Name.Text, Coalesce(cboEdRec3.Selected.VendorName, ""))),
                          RecVendor3Email: Trim(txtEdRec3Email.Text),
                          RecVendor3Remarks: Trim(txtEdRec3Remarks.Text),
                          Remarks: Trim(txtEdRemarks.Text),
                          ActivityLog: Left(Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   requestor edited the RFQ" & If(varMaterialChange, " (specification changed)", "") & Char(10) & Coalesce(varRFQRecord.ActivityLog, ""), 30000)
                      }
                  );
                  If(
                      varMaterialChange && varWasSentOut,
                      Patch(
                          RFQ,
                          varRFQRecord,
                          {
                              'RFQ status': { Value: "Re-RFQ" },
                              AwaitingAction: { Value: "Buyer" },
                              ReRFQCount: Coalesce(varRFQRecord.ReRFQCount, 0) + 1
                          }
                      );
                      If(
                          !IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID)),
                          Patch(
                              RFQ_Checklist,
                              LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID),
                              {
                                  Vendor1UnitPrice: Blank(), Vendor1TotalPrice: Blank(), Vendor1LeadTime: Blank(), Vendor1Status: If(IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID).Vendor1Name), Blank(), { Value: "Awaiting reply" }),
                                  Vendor2UnitPrice: Blank(), Vendor2TotalPrice: Blank(), Vendor2LeadTime: Blank(), Vendor2Status: If(IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID).Vendor2Name), Blank(), { Value: "Awaiting reply" }),
                                  Vendor3UnitPrice: Blank(), Vendor3TotalPrice: Blank(), Vendor3LeadTime: Blank(), Vendor3Status: If(IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID).Vendor3Name), Blank(), { Value: "Awaiting reply" }),
                                  Vendor4UnitPrice: Blank(), Vendor4TotalPrice: Blank(), Vendor4LeadTime: Blank(), Vendor4Status: If(IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID).Vendor4Name), Blank(), { Value: "Awaiting reply" }),
                                  AwardVendor: Blank()
                              }
                          )
                      );
                      // The specification changed after vendors were approached. Their quotes
                      // are now void, so the buyer must re-issue the RFQ.
                      Set(varEdBuyer, Coalesce(varRFQRecord.'Assigned Buyer', Concat(Filter('PWS_SHQ Purchase Requisition SU', (Trim(Lower(Role)) = "buyer" || Trim(Lower(Role)) = "admin") && !IsBlank(ThisRecord.User.Email)), ThisRecord.User.Email, ";")));
                      If(
                          !IsBlank(varEdBuyer),
                          SendRFQNotification.Run(
                              varEdBuyer,
                              varMyMail,
                              "Specification changed, re-quote needed: " & varSelectedRFQ.Title,
                              "<p>The requestor has changed the specification on <strong>" & varSelectedRFQ.Title & "</strong> after it had already gone out to vendors. The quotes held against it have been cleared and the RFQ is back in your queue.</p>
                              <table border=""1"" cellpadding=""8"" cellspacing=""0"" style=""border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:13px;"">
                                <tr><td><strong>New description</strong></td><td>" & Trim(txtEdDescription.Text) & "</td></tr>
                                <tr><td><strong>New quantity</strong></td><td>" & Trim(txtEdQuantity.Text) & " " & Trim(txtEdUOM.Text) & "</td></tr>
                                <tr><td><strong>Needed by</strong></td><td>" & Text(dteEdDueDate.SelectedDate, "dd mmm yyyy") & "</td></tr>
                                <tr><td><strong>Changed by</strong></td><td>" & User().FullName & " (" & varMyMail & ")</td></tr>
                              </table>
                              <p>Please re-issue the RFQ to the vendor list with the corrected specification.</p>
                              <p><a href=""https://rtxusers.sharepoint.us/sites/PWS_SHQ-PW/Lists/RFQ/DispForm.aspx?ID=" & varSelectedRFQ.ID & """>Open this RFQ in SharePoint</a></p>",
                              varSelectedRFQ.ID
                          )
                      );
                      Notify("Saved. Because this RFQ was already with vendors, it has been pushed back to the buyer as a re quote request, the old quotes have been cleared and the buyer has been emailed.", NotificationType.Warning, 6000),
                      Notify("Changes saved.", NotificationType.Success, 3000)
                  );
                  Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
                  Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
                  Set(varSaving, false)
                  )
              )
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =13
            Text: ="Save changes"
            Width: =212
            X: =668
            Y: =588
      - btnEdDiscard:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            Color: =RGBA(56, 96, 178, 1)
            DisabledBorderColor: =RGBA(214, 221, 233, 1)
            DisabledColor: =RGBA(150, 158, 172, 1)
            DisabledFill: =RGBA(232, 236, 243, 1)
            DisplayMode: =If(varCanEdit, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =52
            HoverColor: =RGBA(56, 96, 178, 1)
            HoverFill: =RGBA(240, 244, 251, 1)
            OnSelect: |-
              =Reset(txtEdDescription);
              Reset(txtEdQuantity);
              Reset(txtEdUOM);
              Reset(radEdUrgency);
              Reset(dteEdDueDate);
              Reset(tglEdSoleSource);
