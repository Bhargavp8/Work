      - frmEdAttach:
          Control: Form@2.4.4
          Variant: Classic
          Layout: Vertical
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            DataSource: =RFQ
            DefaultMode: =If(varCanEdit, FormMode.Edit, FormMode.View)
            Height: =330
            Item: =varSelectedRFQ
            NumberOfColumns: =1
            OnFailure: |-
              =Set(varSaving, false);
              Notify("The files could not be saved. " & frmEdAttach.Error, NotificationType.Error, 8000)
            OnSuccess: |-
              =Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
              ClearCollect(colEdDocs, ForAll(varSelectedRFQ.Attachments As Att, { FileName: Att.DisplayName, FileLink: Att.Value }));
              // Files that changed after the vendors were emailed are a trust problem,
              // so the buyer gets to see it in the log rather than finding out later.
              If(
                  varSelectedRFQ.'RFQ status'.Value = "RFQ sent out",
                  Patch(
                      RFQ,
                      LookUp(RFQ, ID = varSelectedRFQ.ID),
                      {
                          ActivityLog: Left(
                              Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   attachments changed AFTER the RFQ was emailed, now " & CountRows(colEdDocs) & " file(s)" & Char(10) &
                              Coalesce(LookUp(RFQ, ID = varSelectedRFQ.ID).ActivityLog, ""),
                              30000
                          )
                      }
                  );
                  Notify("Files saved. The vendors already have the previous set, so tell the buyer if they need to re-send.", NotificationType.Warning, 7000),
                  Notify("Files saved.", NotificationType.Success, 4000)
              );
              Set(varSaving, false)
            Visible: =varShowDocs
            Width: =812
            X: =277
            Y: =208
          Children:
