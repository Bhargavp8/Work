Screens:
  scrEditRFQ:
    Properties:
      Fill: =RGBA(238, 242, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
        Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
        Set(varCanEdit, !(varSelectedRFQ.'RFQ status'.Value in ["RFQ closed/completed", "RFQ cancelled"]));
        Set(varShowHistory, false);
        Set(varShowDocs, false);
        ClearCollect(colEdDocs, ForAll(varSelectedRFQ.Attachments As Att, { FileName: Att.DisplayName, FileLink: Att.Value }));
        Set(varConfirmAction, Blank());
        Set(varSaving, false);
        Reset(txtEdDescription);
        Reset(txtEdQuantity);
        Reset(txtEdUOM);
        Reset(radEdUrgency);
        Reset(dteEdDueDate);
        Reset(tglEdSoleSource);
        Reset(txtEdJustification);
        Reset(txtEdRecVendor);
        Reset(txtEdRecVendorEmail);
        Reset(txtEdRemarks)
    Children:
      - recEdTopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(31, 42, 68, 1)
            Height: =64
            Width: =1366
      - btnEdBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  varCanEdit
                      && (Trim(txtEdDescription.Text) <> Coalesce(varSelectedRFQ.Description, "")
                          || Trim(txtEdQuantity.Text) <> Text(varSelectedRFQ.Quantity)
                          || Trim(txtEdUOM.Text) <> Coalesce(varSelectedRFQ.UOM, "")
                          || radEdUrgency.Selected.Value <> varSelectedRFQ.Urgency.Value
                          || dteEdDueDate.SelectedDate <> varSelectedRFQ.RFQduedate
                          || tglEdSoleSource.Value <> Coalesce(varSelectedRFQ.'Sole Source', false)
                          || Trim(txtEdRemarks.Text) <> Coalesce(varSelectedRFQ.Remarks, "")),
                  Set(varConfirmAction, "leave"),
                  Navigate(scrHome, ScreenTransition.Fade)
              )
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =12
            Text: ="Back"
            Width: =100
            X: =24
            Y: =14
      - lblEdTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =18
            Text: =varSelectedRFQ.Title & "   ·   RFQ details"
            Width: =520
            X: =259
      - recEdStatusPill:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: |-
              =Switch(
                  varSelectedRFQ.'RFQ status'.Value,
                  "RFQ pending", ColorValue("#854F0B"),
                  "RFQ sent out", ColorValue("#185FA5"),
                  "Re-RFQ", ColorValue("#993C1D"),
                  "RFQ closed/completed", ColorValue("#3B6D11"),
                  "RFQ cancelled", ColorValue("#A32D2D"),
                  ColorValue("#444441")
              )
            Height: =32
            Width: =240
            X: =1102
            Y: =16
      - lblEdStatusPill:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =32
            Size: =11
            Text: =Switch(varSelectedRFQ.'RFQ status'.Value, "Re-RFQ", "Re quote requested", varSelectedRFQ.'RFQ status'.Value)
            Width: =240
            X: =1102
            Y: =16
      - recEdFormCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =656
            Width: =620
            X: =24
            Y: =88
      - recEdFormHead:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =40
            Width: =620
            X: =24
            Y: =88
      - lblEdFormHead:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            PaddingLeft: =16
            Text: =If(varCanEdit, "Request details, editable", "Request details, locked (RFQ is closed or cancelled)")
            Width: =620
            X: =24
            Y: =88
      - lblEdLblDesc:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
