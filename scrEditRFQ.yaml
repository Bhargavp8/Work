            HoverBorderColor: =RGBA(56, 96, 178, 1)
            HoverFill: =RGBA(246, 249, 253, 1)
            Size: =12
            Width: =280
            X: =48
            Y: =570
      - lblEdLblRecEmail:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =11
            Text: ="Vendor email (optional)"
            Width: =280
            X: =340
            Y: =546
      - txtEdRecVendorEmail:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            Default: =varSelectedRFQ.RecommendVendorEmail
            DisplayMode: =If(varCanEdit, DisplayMode.Edit, DisplayMode.View)
            Font: =Font.'Open Sans'
            Height: =36
            HintText: ="name@vendor.com"
            HoverBorderColor: =RGBA(56, 96, 178, 1)
            HoverFill: =RGBA(246, 249, 253, 1)
            Size: =12
            Width: =280
            X: =340
            Y: =570
      - lblEdLblRemarks:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =24
            Size: =11
            Text: ="Remarks"
            Width: =280
            X: =48
            Y: =622
      - txtEdRemarks:
          Control: Classic/TextInput@2.3.2
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            Default: =varSelectedRFQ.Remarks
            DisplayMode: =If(varCanEdit, DisplayMode.Edit, DisplayMode.View)
            Font: =Font.'Open Sans'
            Height: =78
            HintText: ="Any comments for the buyer"
            HoverBorderColor: =RGBA(56, 96, 178, 1)
            HoverFill: =RGBA(246, 249, 253, 1)
            Mode: =TextMode.MultiLine
            Size: =12
            Width: =572
            X: =48
            Y: =646
      - recEdProgressCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =150
            Width: =674
            X: =668
            Y: =88
      - lblEdProgressHead:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(24, 34, 56, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =34
            PaddingLeft: =16
            Text: ="Where this RFQ stands"
            Width: =674
            X: =668
            Y: =94
      - lblEdProgressBody:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(43, 54, 78, 1)
            Font: =Font.'Open Sans'
            Height: =96
            PaddingLeft: =16
            PaddingRight: =16
            Size: =11
            Text: |-
              ="Currently waiting on: " & Coalesce(varSelectedRFQ.AwaitingAction.Value, "nobody, this RFQ is finished") &
              Char(10) & "Assigned buyer: " & Coalesce(varSelectedRFQ.'Assigned Buyer', "not assigned yet") &
              Char(10) & "Raised: " & Text(varSelectedRFQ.'RFQ Raise Date', "dd mmm yyyy") & "     Last updated: " & Text(varSelectedRFQ.Modified, "dd mmm yyyy hh:mm") &
              Char(10) & "Due: " & Text(varSelectedRFQ.RFQduedate, "dd mmm yyyy") & If(varSelectedRFQ.RFQduedate < Today() && varCanEdit, "   (past due)", "")
            Width: =674
            X: =668
            Y: =130
      - recEdQuotesCard:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =250
            Width: =674
            X: =668
            Y: =254
      - lblEdQuotesHead:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(24, 34, 56, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =34
            PaddingLeft: =16
            Text: ="Vendors and quotes"
            Width: =674
            X: =668
            Y: =260
      - lblEdQuoteV1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(43, 54, 78, 1)
            Font: =Font.'Open Sans'
            Height: =30
            PaddingLeft: =16
            Size: =11
            Text: |-
              =If(
                  IsBlank(varChecklist.Vendor1Name),
                  "No vendors recorded yet, the buyer has not sent the RFQ out.",
                  varChecklist.Vendor1Name & If(IsBlank(varChecklist.Vendor1TotalPrice), "  ,   quote pending", "  ,   " & Text(varChecklist.Vendor1TotalPrice, "#,##0.00") & " " & varChecklist.Vendor1Currency.Value & ", " & varChecklist.Vendor1LeadTime & " days")
              )
            Width: =674
            X: =668
            Y: =298
      - lblEdQuoteV2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(43, 54, 78, 1)
            Font: =Font.'Open Sans'
            Height: =30
            PaddingLeft: =16
            Size: =11
            Text: =varChecklist.Vendor2Name & If(IsBlank(varChecklist.Vendor2TotalPrice), "  ,   quote pending", "  ,   " & Text(varChecklist.Vendor2TotalPrice, "#,##0.00") & " " & varChecklist.Vendor2Currency.Value & ", " & varChecklist.Vendor2LeadTime & " days")
            Visible: =!IsBlank(varChecklist.Vendor2Name)
            Width: =674
            X: =668
            Y: =328
      - lblEdQuoteV3:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(43, 54, 78, 1)
            Font: =Font.'Open Sans'
            Height: =30
            PaddingLeft: =16
            Size: =11
            Text: =varChecklist.Vendor3Name & If(IsBlank(varChecklist.Vendor3TotalPrice), "  ,   quote pending", "  ,   " & Text(varChecklist.Vendor3TotalPrice, "#,##0.00") & " " & varChecklist.Vendor3Currency.Value & ", " & varChecklist.Vendor3LeadTime & " days")
            Visible: =!IsBlank(varChecklist.Vendor3Name)
            Width: =674
            X: =668
            Y: =358
      - lblEdQuoteV4:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(43, 54, 78, 1)
            Font: =Font.'Open Sans'
            Height: =30
            PaddingLeft: =16
            Size: =11
            Text: =varChecklist.Vendor4Name & If(IsBlank(varChecklist.Vendor4TotalPrice), "  ,   quote pending", "  ,   " & Text(varChecklist.Vendor4TotalPrice, "#,##0.00") & " " & varChecklist.Vendor4Currency.Value & ", " & varChecklist.Vendor4LeadTime & " days")
            Visible: =!IsBlank(varChecklist.Vendor4Name)
            Width: =674
            X: =668
            Y: =388
      - recEdRecommendStrip:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(240, 246, 238, 1)
            Height: =68
            Visible: =!IsBlank(varChecklist.AwardVendor.Value)
            Width: =642
            X: =684
            Y: =426
      - lblEdRecommend:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(59, 109, 17, 1)
            Font: =Font.'Open Sans'
            Height: =68
            PaddingLeft: =14
            PaddingRight: =14
            Size: =11
            Text: |-
              ="Buyer recommends: " & Switch(
                  varChecklist.AwardVendor.Value,
                  "Vendor 1", varChecklist.Vendor1Name,
                  "Vendor 2", varChecklist.Vendor2Name,
                  "Vendor 3", varChecklist.Vendor3Name,
                  "Vendor 4", varChecklist.Vendor4Name,
                  varChecklist.AwardVendor.Value
              ) & Char(10) & PlainText(Coalesce(varChecklist.BuyerNotes, ""))
            Visible: =!IsBlank(varChecklist.AwardVendor.Value)
            Width: =642
            X: =684
            Y: =426
      - btnEdReview:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(255, 191, 0, 1)
            Color: =RGBA(43, 33, 0, 1)
            Fill: =RGBA(255, 191, 0, 1)
            Font: =Font.'Open Sans'
            Height: =52
            HoverColor: =RGBA(43, 33, 0, 1)
            HoverFill: =ColorFade(RGBA(255, 191, 0, 1), -15%)
            OnSelect: |-
              =Set(varShowAlternate, false);
              Navigate(scrAwardConfirm, ScreenTransition.Fade)
            PressedColor: =RGBA(255, 191, 0, 1)
            PressedFill: =RGBA(43, 33, 0, 1)
            Size: =13
            Text: ="Review buyer recommendation and respond"
            Visible: =varSelectedRFQ.AwaitingAction.Value = "Requestor"
            Width: =674
            X: =668
            Y: =520
      - btnEdSave:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(214, 221, 233, 1)
            DisabledColor: =RGBA(150, 158, 172, 1)
            DisabledFill: =RGBA(232, 236, 243, 1)
            DisplayMode: =If(varCanEdit && !varSaving, DisplayMode.Edit, DisplayMode.Disabled)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =52
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Set(varSaving, true);
              If(
                  IsBlank(Trim(txtEdDescription.Text)) || IsBlank(Trim(txtEdQuantity.Text)),
                  Notify("Description and quantity are both required.", NotificationType.Error);
                  Set(varSaving, false),

                  !IsNumeric(txtEdQuantity.Text) || Value(txtEdQuantity.Text) <= 0,
                  Notify("Quantity must be a number greater than zero.", NotificationType.Error);
                  Set(varSaving, false),

                  tglEdSoleSource.Value && IsBlank(Trim(txtEdJustification.Text)),
                  Notify("A sole source request needs a business justification.", NotificationType.Error);
                  Set(varSaving, false),

                  Set(varMaterialChange,
                      Trim(txtEdDescription.Text) <> Coalesce(varSelectedRFQ.Description, "")
                          || Value(txtEdQuantity.Text) <> varSelectedRFQ.Quantity
                          || Trim(txtEdUOM.Text) <> Coalesce(varSelectedRFQ.UOM, "")
                  );
                  Set(varWasSentOut, varSelectedRFQ.'RFQ status'.Value = "RFQ sent out");
                  Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
                  If(
                      IsBlank(varRFQRecord),
                      Notify("This RFQ no longer exists. Somebody may have deleted it. Nothing was saved.", NotificationType.Error, 6000);
                      Set(varSaving, false),

                  Patch(
                      RFQ,
                      varRFQRecord,
                      {
                          Description: Trim(txtEdDescription.Text),
                          Quantity: Value(txtEdQuantity.Text),
                          UOM: Trim(txtEdUOM.Text),
                          Urgency: { Value: radEdUrgency.Selected.Value },
                          RFQduedate: dteEdDueDate.SelectedDate,
                          'Sole Source': tglEdSoleSource.Value,
                          'Business Justification': If(tglEdSoleSource.Value, Trim(txtEdJustification.Text), Blank()),
                          'Recommend Vendor': Trim(txtEdRecVendor.Text),
                          RecommendVendorEmail: Trim(txtEdRecVendorEmail.Text),
                          Remarks: Trim(txtEdRemarks.Text),
                          ActivityLog: Left(Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   requestor edited the RFQ" & If(varMaterialChange, " (specification changed)", "") & Char(10) & Coalesce(varRFQRecord.ActivityLog, ""), 30000)
                      }
                  );
                  If(
                      varMaterialChange && varWasSentOut,
                      Patch(
                          RFQ,
                          varRFQRecord,
                          {
                              'RFQ status': { Value: "Re-RFQ" },
                              AwaitingAction: { Value: "Buyer" },
                              ReRFQCount: Coalesce(varRFQRecord.ReRFQCount, 0) + 1
                          }
                      );
                      If(
                          !IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID)),
                          Patch(
                              RFQ_Checklist,
                              LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID),
                              {
                                  Vendor1UnitPrice: Blank(), Vendor1TotalPrice: Blank(), Vendor1LeadTime: Blank(), Vendor1Status: If(IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID).Vendor1Name), Blank(), { Value: "Awaiting reply" }),
                                  Vendor2UnitPrice: Blank(), Vendor2TotalPrice: Blank(), Vendor2LeadTime: Blank(), Vendor2Status: If(IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID).Vendor2Name), Blank(), { Value: "Awaiting reply" }),
                                  Vendor3UnitPrice: Blank(), Vendor3TotalPrice: Blank(), Vendor3LeadTime: Blank(), Vendor3Status: If(IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID).Vendor3Name), Blank(), { Value: "Awaiting reply" }),
                                  Vendor4UnitPrice: Blank(), Vendor4TotalPrice: Blank(), Vendor4LeadTime: Blank(), Vendor4Status: If(IsBlank(LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID).Vendor4Name), Blank(), { Value: "Awaiting reply" }),
                                  AwardVendor: Blank()
                              }
                          )
                      );
                      Notify("Saved. Because this RFQ was already with vendors, it has been pushed back to the buyer as a re quote request and the old quotes have been cleared.", NotificationType.Warning, 6000),
                      Notify("Changes saved.", NotificationType.Success, 3000)
                  );
                  Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
                  Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
                  Set(varSaving, false)
