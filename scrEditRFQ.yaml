      - btnEdModalYes:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(168, 0, 0, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =If(varConfirmAction = "reopen", RGBA(56, 96, 178, 1), RGBA(168, 0, 0, 1))
            Font: =Font.'Open Sans'
            Height: =44
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(168, 0, 0, 1), -20%)
            OnSelect: |-
              =Switch(
                  varConfirmAction,
                  "leave",
                      Set(varConfirmAction, Blank());
                      Navigate(scrHome, ScreenTransition.Fade),
                  "cancelrfq",
                      Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
                      Patch(
                          RFQ,
                          Coalesce(varRFQRecord, varSelectedRFQ),
                          {
                              'RFQ status': { Value: "RFQ cancelled" },
                              AwaitingAction: { Value: "None" },
                              ActivityLog: Left(Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   RFQ cancelled" & Char(10) & Coalesce(varRFQRecord.ActivityLog, ""), 30000)
                          }
                      );
                      // A cancelled RFQ may still be out with vendors. The buyer has to be
                      // told immediately so they can stand the vendors down.
                      Set(varEdBuyer, Coalesce(varRFQRecord.'Assigned Buyer', Concat(Filter('PWS_SHQ Purchase Requisition SU', (Trim(Lower(Role)) = "buyer" || Trim(Lower(Role)) = "admin") && !IsBlank(ThisRecord.User.Email)), ThisRecord.User.Email, ";")));
                      If(
                          !IsBlank(varEdBuyer),
                          SendRFQNotification.Run(
                              varEdBuyer,
                              varMyMail,
                              "RFQ cancelled: " & varSelectedRFQ.Title,
                              "<p><strong>" & varSelectedRFQ.Title & "</strong> has been cancelled by the requestor.</p>
                              <table border=""1"" cellpadding=""8"" cellspacing=""0"" style=""border-collapse:collapse;font-family:Segoe UI,Arial,sans-serif;font-size:13px;"">
                                <tr><td><strong>Item</strong></td><td>" & PlainText(Coalesce(varSelectedRFQ.Description, "")) & "</td></tr>
                                <tr><td><strong>Status when cancelled</strong></td><td>" & varSelectedRFQ.'RFQ status'.Value & "</td></tr>
                                <tr><td><strong>Cancelled by</strong></td><td>" & User().FullName & " (" & varMyMail & ")</td></tr>
                              </table>
                              <p>If this RFQ was already out with vendors, please stand them down. The RFQ can be reopened later if it was cancelled by mistake.</p>
                              <p><a href=""https://rtxusers.sharepoint.us/sites/PWS_SHQ-PW/Lists/RFQ/DispForm.aspx?ID=" & varSelectedRFQ.ID & """>Open this RFQ in SharePoint</a></p>",
                              varSelectedRFQ.ID
                          )
                      );
                      Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
                      Set(varCanEdit, false);
                      Set(varConfirmAction, Blank());
                      Notify("RFQ cancelled and the buyer has been emailed. You can reopen it from this screen at any time.", NotificationType.Success, 4000),
                  "reopen",
                      Set(varRFQRecord, LookUp(RFQ, ID = varSelectedRFQ.ID));
                      Patch(
                          RFQ,
                          Coalesce(varRFQRecord, varSelectedRFQ),
                          {
                              'RFQ status': { Value: "RFQ pending" },
                              AwaitingAction: { Value: "Buyer" },
                              ActivityLog: Left(Text(Now(), "dd mmm yyyy hh:mm") & "   " & User().FullName & "   RFQ reopened" & Char(10) & Coalesce(varRFQRecord.ActivityLog, ""), 30000)
                          }
                      );
                      Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
                      Set(varCanEdit, true);
                      Set(varConfirmAction, Blank());
                      Notify("RFQ reopened and sent back to the buyer queue.", NotificationType.Success, 4000),
                  Set(varConfirmAction, Blank())
              )
            PressedColor: =RGBA(168, 0, 0, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =12
            Text: |-
