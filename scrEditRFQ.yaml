                Variant: ClassicAttachmentsEdit
                Properties:
                  BorderColor: =RGBA(214, 221, 233, 1)
                  DataField: ="{Attachments}"
                  Default: =ThisItem.Attachments
                  DisplayName: =DataSourceInfo([@RFQ],DataSourceInfo.DisplayName,Attachments)
                  Height: =330
                  Required: =false
                  Update: =attEdAttachments.Attachments
                  Width: =812
                  X: =0
                  Y: =0
                Children:
                  - DataCardKey_EdAttach:
                      Control: Label@2.5.1
                      MetadataKey: FieldName
                      Properties:
                        BorderColor: =RGBA(0, 0, 0, 0)
                        BorderStyle: =BorderStyle.None
                        Height: =1
                        PaddingLeft: =0
                        Text: =Parent.DisplayName
                        Visible: =false
                        Width: =Parent.Width
                  - attEdAttachments:
                      Control: Attachments@2.3.0
                      MetadataKey: FieldValue
                      Properties:
                        AddAttachmentText: ="Add a file"
                        BorderColor: =If(IsBlank(Parent.Error), Parent.BorderColor, Color.Red)
                        BorderStyle: =BorderStyle.None
                        Color: =RGBA(96, 106, 126, 1)
                        DisplayMode: =Parent.DisplayMode
                        Font: =Font.'Open Sans'
                        Height: =320
                        ItemColor: =RGBA(255, 255, 255, 1)
                        ItemFill: =RGBA(56, 96, 178, 1)
                        ItemHoverFill: =RGBA(186, 202, 226, 1)
                        Items: =Parent.Default
                        MaxAttachmentSize: =20
                        MaxAttachments: =10
                        NoAttachmentsColor: =RGBA(150, 158, 172, 1)
                        NoAttachmentsText: ="No files attached yet."
                        PaddingLeft: =If(Self.DisplayMode = DisplayMode.Edit, 5, 0)
