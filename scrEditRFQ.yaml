Screens:
  scrEditRFQ:
    Properties:
      Fill: =RGBA(238, 242, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varSelectedRFQ, LookUp(RFQ, ID = varSelectedRFQ.ID));
        Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varSelectedRFQ.ID));
        Set(varCanEdit, !(varSelectedRFQ.'RFQ status'.Value in ["RFQ closed/completed", "RFQ cancelled"]));
        Set(varShowHistory, false);
        Set(varShowDocs, false);
        ClearCollect(colEdDocs, ForAll(varSelectedRFQ.Attachments As Att, { FileName: Att.DisplayName, FileLink: Att.Value }));
        Set(varConfirmAction, Blank());
        Set(varSaving, false);
        // Without this the app can serve a cached copy of the master list taken
        // before Emailcontact0 was populated, so vendors arrive with no address.
        Refresh('SG Vendor Master List');
        ClearCollect(
            colVendorList,
            ForAll(
                'SG Vendor Master List' As V,
                { VendorName: V.field_2, VendorEmail: Coalesce(V.'Email contact (Emailcontact0)', "") }
            )
        );
        Set(varEdRec1Name, Coalesce(varSelectedRFQ.'Recommend Vendor', ""));
        Set(varEdRec1Email, Coalesce(varSelectedRFQ.RecommendVendorEmail, ""));
        Set(varEdRec1Manual, !IsBlank(varEdRec1Name) && CountRows(Filter(colVendorList, VendorName = varEdRec1Name)) = 0);
        Set(varEdRec2Name, Coalesce(varSelectedRFQ.RecVendor2Name, ""));
        Set(varEdRec2Email, Coalesce(varSelectedRFQ.RecVendor2Email, ""));
        Set(varEdRec2Manual, !IsBlank(varEdRec2Name) && CountRows(Filter(colVendorList, VendorName = varEdRec2Name)) = 0);
        Set(varEdRec3Name, Coalesce(varSelectedRFQ.RecVendor3Name, ""));
        Set(varEdRec3Email, Coalesce(varSelectedRFQ.RecVendor3Email, ""));
        Set(varEdRec3Manual, !IsBlank(varEdRec3Name) && CountRows(Filter(colVendorList, VendorName = varEdRec3Name)) = 0);
        Reset(txtEdDescription);
        Reset(txtEdQuantity);
        Reset(txtEdUOM);
        Reset(radEdUrgency);
        Reset(dteEdDueDate);
        Reset(tglEdSoleSource);
        Reset(txtEdJustification);
        Reset(tglEdRec1Manual); Reset(cboEdRec1); Reset(txtEdRec1Name); Reset(txtEdRec1Email); Reset(txtEdRec1Remarks);
        Reset(tglEdRec2Manual); Reset(cboEdRec2); Reset(txtEdRec2Name); Reset(txtEdRec2Email); Reset(txtEdRec2Remarks);
        Reset(tglEdRec3Manual); Reset(cboEdRec3); Reset(txtEdRec3Name); Reset(txtEdRec3Email); Reset(txtEdRec3Remarks);
        Reset(txtEdRemarks)
    Children:
      - recEdTopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(31, 42, 68, 1)
            Height: =64
            Width: =1366
      - btnEdBack:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =If(
                  varCanEdit
                      && (Trim(txtEdDescription.Text) <> Coalesce(varSelectedRFQ.Description, "")
                          || Trim(txtEdQuantity.Text) <> Text(varSelectedRFQ.Quantity)
                          || Trim(txtEdUOM.Text) <> Coalesce(varSelectedRFQ.UOM, "")
                          || dteEdDueDate.SelectedDate <> varSelectedRFQ.RFQduedate
                          || tglEdSoleSource.Value <> Coalesce(varSelectedRFQ.'Sole Source', false)
                              || Trim(txtEdRemarks.Text) <> Coalesce(varSelectedRFQ.Remarks, "")
                          || Trim(txtEdJustification.Text) <> Coalesce(varSelectedRFQ.'Business Justification', "")
                          || Trim(If(tglEdRec1Manual.Value, txtEdRec1Name.Text, Coalesce(cboEdRec1.Selected.VendorName, ""))) <> Coalesce(varSelectedRFQ.'Recommend Vendor', "")
                          || Trim(txtEdRec1Email.Text) <> Coalesce(varSelectedRFQ.RecommendVendorEmail, "")
                          || Trim(txtEdRec1Remarks.Text) <> Coalesce(varSelectedRFQ.RecommendVendorRemarks, "")
                          || Trim(If(tglEdRec2Manual.Value, txtEdRec2Name.Text, Coalesce(cboEdRec2.Selected.VendorName, ""))) <> Coalesce(varSelectedRFQ.RecVendor2Name, "")
                          || Trim(txtEdRec2Email.Text) <> Coalesce(varSelectedRFQ.RecVendor2Email, "")
                          || Trim(txtEdRec2Remarks.Text) <> Coalesce(varSelectedRFQ.RecVendor2Remarks, "")
                          || Trim(If(tglEdRec3Manual.Value, txtEdRec3Name.Text, Coalesce(cboEdRec3.Selected.VendorName, ""))) <> Coalesce(varSelectedRFQ.RecVendor3Name, "")
                          || Trim(txtEdRec3Email.Text) <> Coalesce(varSelectedRFQ.RecVendor3Email, "")
                          || Trim(txtEdRec3Remarks.Text) <> Coalesce(varSelectedRFQ.RecVendor3Remarks, "")),
                  Set(varConfirmAction, "leave"),
                  Navigate(scrHome, ScreenTransition.Fade)
              )
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =12
            Text: ="Back"
            Width: =100
            X: =24
            Y: =14
