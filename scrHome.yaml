            Font: =Font.'Open Sans'
            Height: =36
            PaddingLeft: =10
            Size: =11
            Text: ="RFQ NUMBER"
            X: =24
            Y: =212
      - lblHmHead2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
