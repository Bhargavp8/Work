            Width: =92
            X: =888
            Y: =152
      - recHmTableHead:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(11, 33, 84, 1)
            Height: =36
            Width: =956
            X: =24
            Y: =212
      - lblHmHead1:
          Control: Label@2.5.1
