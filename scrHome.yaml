            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(43, 54, 78, 1)
            Font: =Font.'Open Sans'
            Height: =44
            Size: =12
            Text: ="Awaiting me"
            Width: =76
            X: =722
            Y: =152
      - tglHmAwaitingMe:
