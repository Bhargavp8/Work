      - recHmHelp:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(247, 249, 252, 1)
            Height: =104
            Width: =336
            X: =1006
            Y: =640
      - lblHmHelp:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =88
            PaddingLeft: =14
            PaddingRight: =14
            Size: =10
            Text: |-
              ="Tip: select any RFQ to view or edit it. RFQs stay editable until they are closed or cancelled, and a closed RFQ can be reopened if something was actioned by mistake."
            Width: =336
            X: =1006
            Y: =648
      - cboHmSort:
          Control: Classic/ComboBox@2.4.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            ChevronBackground: =RGBA(255, 255, 255, 1)
            ChevronFill: =RGBA(56, 96, 178, 1)
            ChevronHoverBackground: =RGBA(240, 244, 251, 1)
            ChevronHoverFill: =RGBA(56, 96, 178, 1)
            DefaultSelectedItems: |-
              =Table({ Value: "Waiting on me first" })
            DisplayFields: =["Value"]
            Font: =Font.'Open Sans'
            Height: =44
            HoverFill: =RGBA(246, 249, 253, 1)
            InputTextPlaceholder: ="Sort by"
            Items: |-
              =Table(
                  { Value: "Waiting on me first" },
                  { Value: "Due date, soonest first" },
                  { Value: "Due date, latest first" },
                  { Value: "Recently updated" },
                  { Value: "RFQ number, newest first" },
                  { Value: "RFQ number, oldest first" },
                  { Value: "Status" }
              )
            SearchFields: =["Value"]
            SelectMultiple: =false
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            Size: =11
            Width: =214
            X: =500
            Y: =152
      - cboHmStatus:
          Control: Classic/ComboBox@2.4.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
