            Font: =Font.'Open Sans'
            Height: =36
            PaddingLeft: =10
            Size: =11
            Text: ="DUE DATE"
            Width: =120
            X: =174
            Y: =212
      - lblHmHead3:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =36
            PaddingLeft: =10
            Size: =11
            Text: ="STATUS"
            Width: =170
            X: =294
            Y: =212
      - lblHmHead4:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =36
            PaddingLeft: =10
            Size: =11
            Text: ="AWAITING"
            Width: =130
            X: =464
            Y: =212
      - lblHmHead5:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            Height: =36
            PaddingLeft: =10
            Size: =11
            Text: ="DESCRIPTION"
            Width: =336
            X: =594
            Y: =212
      - galHmRFQs:
          Control: Gallery@2.15.0
          Variant: Vertical
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            Height: =492
            Items: |-
              =With(
                  {
                      base: Filter(
                          colMyRFQs,
                          (IsBlank(txtHmSearch.Text)
                              || StartsWith(Title, txtHmSearch.Text)
                              || txtHmSearch.Text in Description),
                          (IsBlank(cboHmStatus.Selected) || 'RFQ status'.Value = cboHmStatus.Selected.Value),
                          (!tglHmAwaitingMe.Value || AwaitingAction.Value = "Requestor")
                      )
                  },
                  Switch(
                      Coalesce(cboHmSort.Selected.Value, "Waiting on me first"),
                      // Sort by due date underneath, then bring the ones that need the
                      // requestor to the top. Power Fx Sort is stable, so both hold.
                      "Waiting on me first",
                          Sort(Sort(base, RFQduedate, SortOrder.Ascending), If(AwaitingAction.Value = "Requestor", 0, 1), SortOrder.Ascending),
                      "Due date, soonest first", Sort(base, RFQduedate, SortOrder.Ascending),
                      "Due date, latest first", Sort(base, RFQduedate, SortOrder.Descending),
                      "Recently updated", Sort(base, Modified, SortOrder.Descending),
                      "RFQ number, newest first", Sort(base, ID, SortOrder.Descending),
                      "RFQ number, oldest first", Sort(base, ID, SortOrder.Ascending),
                      "Status", Sort(Sort(base, RFQduedate, SortOrder.Ascending), 'RFQ status'.Value, SortOrder.Ascending),
                      Sort(base, Modified, SortOrder.Descending)
                  )
              )
            OnSelect: |-
              =Set(varSelectedRFQ, LookUp(RFQ, ID = ThisItem.ID));
              Set(varChecklist, LookUp(RFQ_Checklist, RFQID = ThisItem.ID));
              Set(varShowAlternate, false);
              Navigate(scrEditRFQ, ScreenTransition.Fade)
            TemplateFill: =If(ThisItem.IsSelected, RGBA(233, 239, 250, 1), RGBA(255, 255, 255, 1))
            TemplatePadding: =0
            TemplateSize: =46
            Width: =956
            X: =24
            Y: =252
          Children:
            - recHmRowAccent:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =If(ThisItem.AwaitingAction.Value = "Requestor", RGBA(255, 191, 0, 1), RGBA(255, 255, 255, 0))
                  Height: =46
                  OnSelect: =Select(Parent)
                  Width: =4
            - lblHmRowTitle:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(24, 34, 56, 1)
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =46
                  OnSelect: =Select(Parent)
                  PaddingLeft: =10
                  Size: =12
                  Text: =ThisItem.Title
            - lblHmRowDue:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =If(
                        ThisItem.'RFQ status'.Value in ["RFQ closed/completed", "RFQ cancelled"], RGBA(96, 106, 126, 1),
                        ThisItem.RFQduedate < Today(), ColorValue("#A32D2D"),
                        ThisItem.RFQduedate <= Today() + 2, ColorValue("#854F0B"),
                        RGBA(43, 54, 78, 1)
                    )
                  Font: =Font.'Open Sans'
                  Height: =46
                  OnSelect: =Select(Parent)
                  PaddingLeft: =10
                  Size: =11
                  Text: =Text(ThisItem.RFQduedate, "dd mmm yyyy")
                  Width: =120
                  X: =150
            - lblHmRowStatus:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: |-
                    =Switch(
                        ThisItem.'RFQ status'.Value,
                        "RFQ pending", ColorValue("#854F0B"),
                        "RFQ sent out", ColorValue("#185FA5"),
                        "Re-RFQ", ColorValue("#993C1D"),
                        "RFQ closed/completed", ColorValue("#3B6D11"),
                        "RFQ cancelled", ColorValue("#A32D2D"),
                        ColorValue("#444441")
                    )
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =46
                  OnSelect: =Select(Parent)
                  PaddingLeft: =10
                  Size: =11
                  Text: =Switch(ThisItem.'RFQ status'.Value, "Re-RFQ", "Re quote requested", ThisItem.'RFQ status'.Value)
                  Width: =170
                  X: =270
            - lblHmRowAwaiting:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =If(ThisItem.AwaitingAction.Value = "Requestor", ColorValue("#854F0B"), RGBA(96, 106, 126, 1))
                  Font: =Font.'Open Sans'
                  Height: =46
                  OnSelect: =Select(Parent)
                  PaddingLeft: =10
                  Size: =11
                  Text: =If(ThisItem.AwaitingAction.Value = "Requestor", "You", Coalesce(ThisItem.AwaitingAction.Value, ","))
                  Width: =130
                  X: =440
            - lblHmRowDesc:
                Control: Label@2.5.1
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Color: =RGBA(43, 54, 78, 1)
                  Font: =Font.'Open Sans'
                  Height: =46
                  OnSelect: =Select(Parent)
                  PaddingLeft: =10
                  Size: =11
                  Text: =Left(ThisItem.Description, 70) & If(Len(ThisItem.Description) > 70, "...", "")
                  Width: =336
                  X: =570
            - icoHmRowOpen:
                Control: Classic/Icon@2.5.0
                Properties:
                  BorderColor: =RGBA(0, 0, 0, 1)
                  Color: =RGBA(56, 96, 178, 1)
                  Height: =46
                  Icon: =Icon.ChevronRight
                  OnSelect: =Select(Parent)
                  PaddingBottom: =15
                  PaddingLeft: =15
                  PaddingRight: =15
                  PaddingTop: =15
                  Tooltip: ="Open and edit this RFQ"
                  Width: =44
                  X: =906
            - recHmRowLine:
                Control: Rectangle@2.3.0
                Properties:
                  BorderColor: =RGBA(0, 18, 107, 1)
                  Fill: =RGBA(230, 235, 243, 1)
                  Height: =1
                  OnSelect: =Select(Parent)
                  Width: =956
                  Y: =45
      - lblHmEmptyState:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
