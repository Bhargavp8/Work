Screens:
  scrHome:
    Properties:
      Fill: =RGBA(238, 242, 248, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
      OnVisible: |-
        =Set(varConfirmAction, Blank());
        Set(varShowAlternate, false);
        Set(varSaving, false);
        Refresh(RFQ);
        ClearCollect(colMyRFQs, Filter(RFQ, 'Requestor Email' = User().Email || 'Requestor Email' = varMyMail));
        Reset(txtHmSearch);
        Reset(cboHmStatus);
        Reset(tglHmAwaitingMe);
        Reset(cboHmSort);
        Set(varHmDeepGo, false);
        If(
            varDeepLinkID > 0 && !IsBlank(LookUp(RFQ, ID = varDeepLinkID)),
            Set(varSelectedRFQ, LookUp(RFQ, ID = varDeepLinkID));
            Set(varChecklist, LookUp(RFQ_Checklist, RFQID = varDeepLinkID));
            Set(varDeepLinkID, 0);
            Set(varHmDeepGo, true)
        )
    Children:
      - recHmTopBar:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(31, 42, 68, 1)
            Height: =64
            Width: =1366
      - lblHmAppTitle:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(255, 255, 255, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =64
            Size: =18
            Text: ="Request For Quotation (RFQ)"
            Width: =420
            X: =99
      - lblHmUserChip:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Right
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(206, 216, 236, 1)
            Font: =Font.'Open Sans'
            Height: =64
            Size: =12
            Text: =User().FullName & "  •  " & Coalesce(varRole, "Requestor")
            Width: =380
            X: =820
      - btnHmRefresh:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =36
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: |-
              =Refresh(RFQ);
              ClearCollect(colMyRFQs, Filter(RFQ, 'Requestor Email' = User().Email || 'Requestor Email' = varMyMail));
              Notify("RFQ list refreshed.", NotificationType.Success, 2000)
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =12
            Text: ="Refresh"
            Width: =118
            X: =1224
            Y: =14
      - btnHmNewRFQ:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =RGBA(56, 96, 178, 1)
            Color: =RGBA(255, 255, 255, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =48
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate(scrNewRFQ, ScreenTransition.Fade)
            PressedColor: =RGBA(56, 96, 178, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            Size: =14
            Text: ="+  Raise New RFQ"
            Width: =212
            X: =24
            Y: =88
      - recHmChip1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            Width: =228
            X: =252
            Y: =88
      - lblHmChip1:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(96, 106, 126, 1)
            Font: =Font.'Open Sans'
            Height: =48
            Size: =11
            Text: ="OPEN RFQs      " & CountRows(Filter(colMyRFQs, !('RFQ status'.Value in ["RFQ closed/completed", "RFQ cancelled"])))
            Width: =204
            X: =264
            Y: =88
      - recHmChip2:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            Width: =228
            X: =496
            Y: =88
      - lblHmChip2:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(133, 79, 11, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =48
            Size: =11
            Text: ="AWAITING YOU      " & CountRows(Filter(colMyRFQs, AwaitingAction.Value = "Requestor"))
            Width: =204
            X: =508
            Y: =88
      - recHmChip3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(214, 221, 233, 1)
            BorderThickness: =1
            Fill: =RGBA(255, 255, 255, 1)
            Height: =48
            Width: =240
            X: =740
            Y: =88
      - lblHmChip3:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =RGBA(163, 45, 45, 1)
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Height: =48
            Size: =11
            Text: ="PAST DUE DATE      " & CountRows(Filter(colMyRFQs, RFQduedate < Today(), !('RFQ status'.Value in ["RFQ closed/completed", "RFQ cancelled"])))
            Width: =216
            X: =752
            Y: =88
      - txtHmSearch:
